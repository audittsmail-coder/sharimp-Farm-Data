<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>บันทึกฟาร์มกุ้งรายสัปดาห์</title>
<meta name="description" content="แอปบันทึกข้อมูลฟาร์มกุ้งรายสัปดาห์ ติดตามไซส์กุ้ง อาหาร และ ADG ใช้งานได้แบบออฟไลน์">
<meta name="theme-color" content="#1F6E5F">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ฟาร์มกุ้ง">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C1917;
    --surface:#142723;
    --surface-soft:#1A322C;
    --ink:#ECF5F1;
    --ink-soft:#9FB7AE;
    --ink-faint:#6E8880;
    --teal-900:#081A18;
    --teal-700:#1B4F46;
    --teal-600:#1F6E5F;
    --teal-500:#2FA38C;
    --heading:#8FE0CB;
    --teal-100:rgba(47,163,140,.16);
    --coral:#E8815F;
    --coral-soft:rgba(232,129,95,.16);
    --amber:#EFB753;
    --amber-soft:rgba(239,183,83,.16);
    --line:#223C36;
    --danger:#E2695A;
    --radius:14px;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Thai', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{ font-family:'Taviraj', serif; font-weight:600; letter-spacing:.2px; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; }

  #app{ max-width:720px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; }

  .app-banner{
    background:var(--teal-100); color:var(--heading); font-size:12px; text-align:center;
    padding:7px 10px; font-weight:600;
  }
  .app-banner.warn{ background:var(--amber-soft); color:#F0C878; }

  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--teal-600);
    color:#fff;
    padding:14px 16px;
    display:flex; align-items:center; gap:10px;
  }
  .topbar .wave{ width:26px; height:26px; flex:none; }
  .topbar h1{ font-size:19px; margin:0; color:#fff; flex:1; }
  .topbar .sub{ font-size:11px; color:var(--teal-100); opacity:.85; margin-top:1px; }
  .icon-btn{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); color:#fff;
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none;
  }
  .icon-btn:active{ transform:scale(.94); }

  .backbar{ display:flex; align-items:center; gap:8px; padding:12px 16px 0 16px; }
  .back-btn{
    background:none; border:none; color:var(--teal-700); font-size:14px; font-weight:600;
    display:flex; align-items:center; gap:4px; cursor:pointer; padding:6px 4px;
  }

  main{ flex:1; padding:14px 16px 28px 16px; }

  .farm-tabs{ display:flex; gap:8px; overflow-x:auto; padding:12px 16px 4px 16px; -webkit-overflow-scrolling:touch; }
  .farm-tabs::-webkit-scrollbar{ display:none; }
  .farm-tab{
    flex:none; padding:8px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); font-size:13.5px; font-weight:500;
    cursor:pointer; white-space:nowrap;
  }
  .farm-tab.active{ background:var(--teal-600); border-color:var(--teal-600); color:#fff; }

  .farm-title-row{ display:flex; align-items:center; justify-content:space-between; margin:6px 0 12px 0; }
  .farm-title-row h2{ font-size:20px; margin:0; color:var(--heading); }
  .farm-title-row button{ background:none; border:none; color:var(--ink-faint); font-size:12px; cursor:pointer; text-decoration:underline; }

  .pond-grid{ display:grid; grid-template-columns:1fr; gap:8px; }
  .pond-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:11px 12px; box-shadow:var(--shadow); cursor:pointer; position:relative;
  }
  .pond-card:active{ transform:scale(.99); }
  .pond-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .pond-card h3{ margin:0; font-size:16px; color:var(--heading); }
  .pond-meta{ font-size:12px; color:var(--ink-soft); margin-top:1px; }
  .doc-chip{ background:var(--teal-100); color:var(--teal-700); font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; flex:none; }
  .stat-row{ display:flex; gap:8px; margin-top:8px; }
  .stat{ flex:1; background:var(--surface-soft); border-radius:9px; padding:5px 9px; }
  .stat .label{ font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; }
  .stat .val{ font-size:16.5px; font-weight:700; color:var(--ink); margin-top:0px; }
  .stat .val.coral{ color:var(--coral); }
  .stat .val.amber{ color:var(--amber); }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-faint); }
  .empty-state svg{ margin-bottom:10px; opacity:.5; }
  .empty-state p{ font-size:13.5px; margin:4px 0; }

  .fab{
    width:100%; margin-top:14px;
    background:var(--coral); color:#fff; border:none; border-radius:14px;
    padding:13px 16px; font-size:14.5px; font-weight:600; box-shadow:0 6px 18px rgba(232,129,95,.25);
    display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  }
  .fab:active{ transform:scale(.98); }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); margin-bottom:14px; }
  .card h3{ margin:0 0 12px 0; font-size:15.5px; color:var(--heading); display:flex; align-items:center; gap:7px;}
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:500; }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    font-size:14.5px; color:var(--ink); background:var(--surface-soft);
  }
  .field input::placeholder, .field textarea::placeholder{ color:var(--ink-faint); }
  .field select{ color-scheme:dark; }
  .field input[type=date]{ color-scheme:dark; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--teal-500); outline-offset:0; border-color:var(--teal-500); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .btn{ border:none; border-radius:11px; padding:11px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn-primary{ background:var(--teal-600); color:#fff; width:100%; }
  .btn-primary:active{ background:var(--teal-700); }
  .btn-secondary{ background:var(--surface-soft); color:var(--ink); }
  .btn-danger-text{ background:none; color:var(--danger); font-weight:600; font-size:13px; text-decoration:underline; }
  .btn-block{ width:100%; }
  .btn-row{ display:flex; gap:10px; margin-top:4px; }

  .pond-head{ margin-bottom:4px; }
  .pond-head h2{ font-size:21px; margin:0; color:var(--heading); }
  .tag-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .tag{ background:var(--surface-soft); color:var(--ink-soft); font-size:12px; padding:4px 10px; border-radius:999px; }
  .tag.coral{ background:var(--coral-soft); color:var(--coral); }
  .tag.amber{ background:var(--amber-soft); color:var(--amber); }

  .summary-strip{ display:flex; gap:10px; margin:14px 0; }
  .summary-box{ flex:1; background:var(--teal-600); color:#fff; border-radius:12px; padding:12px; text-align:center; }
  .summary-box .n{ font-size:19px; font-weight:700; font-family:'Taviraj',serif; }
  .summary-box .l{ font-size:10.5px; opacity:.75; margin-top:2px; }
  .summary-box.coral{ background:var(--coral); }
  .summary-box.amber{ background:var(--amber); color:#3A2A08; }

  .chart-wrap{ position:relative; height:180px; margin-top:6px; }

  table.rec-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.rec-table th{ text-align:left; color:var(--ink-faint); font-weight:600; font-size:11px; text-transform:uppercase; padding:6px 6px; border-bottom:1px solid var(--line); }
  table.rec-table td{ padding:8px 6px; border-bottom:1px solid var(--line); color:var(--ink); }
  table.rec-table tr:last-child td{ border-bottom:none; }
  .row-del{ color:var(--danger); font-size:11px; background:none; border:none; cursor:pointer; text-decoration:underline;}

  .panel-card{ border-color:var(--teal-500); }

  .loading{ display:flex; align-items:center; justify-content:center; padding:60px 0; color:var(--ink-faint); font-size:13px; }

  .app-version{ font-size:11px; color:var(--ink-faint); margin-top:10px; }

  .update-toast{
    position:fixed; left:12px; right:12px; bottom:12px; max-width:696px; margin:0 auto;
    background:var(--teal-600); color:#fff; padding:12px 14px; border-radius:12px;
    box-shadow:var(--shadow); display:flex; align-items:center; gap:10px; font-size:13.5px; z-index:50;
  }
  .update-toast button{
    background:#fff; color:var(--teal-700); border:none; border-radius:8px; padding:8px 12px;
    font-weight:600; font-size:13px; cursor:pointer; flex:none;
  }

  @media (max-width:380px){ .field-row{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div id="app"><div class="loading">กำลังโหลด…</div></div>

<script>
/* ============================================================
   SHRIMP FARM WEEKLY TRACKER
   Data is stored locally on-device (localStorage) so the app
   works fully offline as an installed PWA. No cloud sync.
   ============================================================ */

const APP_VERSION = '__BUILD_VERSION__';

const ICONS = {
  wave: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 15c1.5-1.5 3-1.5 4.5 0s3 1.5 4.5 0 3-1.5 4.5 0 3 1.5 4.5 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M2 19c1.5-1.5 3-1.5 4.5 0s3 1.5 4.5 0 3-1.5 4.5 0 3 1.5 4.5 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/><path d="M12 4c0 0-3 2.2-3 5a3 3 0 006 0c0-2.8-3-5-3-5z" fill="currentColor"/></svg>`,
  gear: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 13.5a1.7 1.7 0 00.34 1.87l.06.06a2.05 2.05 0 11-2.9 2.9l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V20a2.05 2.05 0 01-4.1 0v-.1a1.7 1.7 0 00-1.1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2.05 2.05 0 11-2.9-2.9l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H4a2.05 2.05 0 010-4.1h.1a1.7 1.7 0 001.55-1.1 1.7 1.7 0 00-.34-1.87l-.06-.06a2.05 2.05 0 112.9-2.9l.06.06a1.7 1.7 0 001.87.34H10a1.7 1.7 0 001-1.55V4a2.05 2.05 0 014.1 0v.1a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2.05 2.05 0 112.9 2.9l-.06.06a1.7 1.7 0 00-.34 1.87V10a1.7 1.7 0 001.55 1h.1a2.05 2.05 0 010 4.1h-.1a1.7 1.7 0 00-1.55 1z" stroke="currentColor" stroke-width="1.4"/></svg>`,
  back: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  plus: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  shrimp: `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="#DCEBE6"/><path d="M8 15c1-4 3-7 6-8" stroke="#14584F" stroke-width="1.5" stroke-linecap="round"/><circle cx="15" cy="8" r="1.3" fill="#D9694A"/></svg>`,
};

const STORAGE_KEY = 'shrimp-farm-data-v1';
const FARM_SEED = ['ฟาร์ม 1','ฟาร์ม 2','ฟาร์ม 3','ฟาร์ม 4','ฟาร์ม 5'];
const SPECIES_OPTIONS = ['กุ้งขาว (Vannamei)','กุ้งกุลาดำ (Black Tiger)','อื่นๆ'];

let state = { farms: [], ponds: [], records: [] };
let currentFarmId = null;
let currentPondId = null;
let showSettingsSheet = false;
let showPondFormSheet = false;
let editingPond = null;
let editingRecordId = null;

/* ---------------- Utilities ---------------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmtDate(iso){ if(!iso) return '-'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'2-digit'}); }
function daysBetween(a,b){ const d1=new Date(a+'T00:00:00'), d2=new Date(b+'T00:00:00'); return Math.round((d2-d1)/86400000); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function weightFromCount(count){ if(!count||count<=0) return null; return 1000/count; }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------------- Data layer (localStorage, works fully offline) ---------------- */
let storageAvailable = true;

function defaultSeed(){
  return {
    farms: FARM_SEED.map((name,i)=>({id:'farm'+(i+1), name, order:i})),
    ponds: [],
    records: [],
  };
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
    const seeded = defaultSeed();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
    return seeded;
  }catch(e){
    storageAvailable = false;
    console.warn('localStorage not available — running in-memory only, data will not persist.', e);
    return defaultSeed();
  }
}

async function persist(){
  if(!storageAvailable) return;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('save failed', e); storageAvailable = false; }
}

function pondsForFarm(farmId){ return state.ponds.filter(p=>p.farmId===farmId); }
function recordsForPond(pondId){
  return state.records.filter(r=>r.pondId===pondId).slice().sort((a,b)=>a.weekDate.localeCompare(b.weekDate));
}
function computeAdgForPond(p, recs){
  if(!recs || recs.length===0) return null;
  const last = recs[recs.length-1];
  const lastWeight = weightFromCount(last.sizeCount);
  if(lastWeight===null) return null;
  if(recs.length>=2){
    const prev = recs[recs.length-2];
    const dDays = daysBetween(prev.weekDate, last.weekDate);
    const wPrev = weightFromCount(prev.sizeCount);
    if(dDays>0 && wPrev!==null) return (lastWeight-wPrev)/dDays;
  }
  if(p.releaseDate){
    const doc = daysBetween(p.releaseDate, last.weekDate);
    if(doc>0) return lastWeight/doc;
  }
  return null;
}

/* ---------------- Bootstrap ---------------- */
async function boot(){
  try{
    state = await loadState();
  }catch(e){
    console.error('boot() failed, falling back to in-memory defaults', e);
    storageAvailable = false;
    state = defaultSeed();
  }
  if(state.farms.length) currentFarmId = state.farms[0].id;
  render();
}

/* ---------------- Rendering ---------------- */
function render(){
  const app = document.getElementById('app');
  let html = `
    <div class="app-banner ${storageAvailable ? '' : 'warn'}">${storageAvailable ? 'บันทึกข้อมูลในเครื่องนี้ · ใช้งานออฟไลน์ได้' : 'ไม่สามารถบันทึกข้อมูลในอุปกรณ์นี้ได้ ข้อมูลจะหายเมื่อปิดหน้าต่าง'}</div>
    <div class="topbar">
      <div class="wave">${ICONS.wave}</div>
      <div style="flex:1">
        <h1>บันทึกฟาร์มกุ้ง</h1>
        <div class="sub">ข้อมูลรายสัปดาห์ · ${state.farms.length} ฟาร์ม</div>
      </div>
      <button class="icon-btn" id="btn-settings" title="ตั้งค่า">${ICONS.gear}</button>
    </div>
  `;

  let panelHtml = '';
  if(showSettingsSheet) panelHtml += renderSettingsPanel();
  if(showPondFormSheet) panelHtml += renderPondFormPanel();
  if(panelHtml) html += `<div style="padding:14px 16px 0 16px">${panelHtml}</div>`;

  if(currentPondId){
    html += renderPondDetail();
  } else {
    html += renderFarmDashboard();
  }

  app.innerHTML = html;
  bindDashboardEvents();

  if(currentPondId) drawCharts();
}

function renderFarmDashboard(){
  const tabs = state.farms.map(f => `
    <button class="farm-tab ${f.id===currentFarmId?'active':''}" data-farm="${f.id}">${escapeHtml(f.name)}</button>
  `).join('');

  const farm = state.farms.find(f=>f.id===currentFarmId);
  const ponds = pondsForFarm(currentFarmId);
  let pondsHtml = '';
  if(ponds.length === 0){
    pondsHtml = `
      <div class="empty-state">
        ${ICONS.shrimp}
        <p><b>ยังไม่มีบ่อในฟาร์มนี้</b></p>
        <p>กดปุ่ม "+ เพิ่มบ่อ" ด้านล่างเพื่อเริ่มบันทึกข้อมูล</p>
      </div>`;
  } else {
    pondsHtml = `<div class="pond-grid">` + ponds.map(p => renderPondCard(p)).join('') + `</div>`;
  }

  return `
    <div class="farm-tabs">${tabs}</div>
    <main>
      <div class="farm-title-row">
        <h2>${escapeHtml(farm ? farm.name : '')}</h2>
        <button data-rename-farm="${farm?farm.id:''}">แก้ชื่อฟาร์ม</button>
      </div>
      ${pondsHtml}
      <button class="fab" id="btn-add-pond">${ICONS.plus} เพิ่มบ่อใหม่</button>
    </main>
  `;
}

function renderPondCard(p){
  const doc = p.releaseDate ? daysBetween(p.releaseDate, todayISO()) : null;
  const recs = recordsForPond(p.id);
  const last = recs[recs.length-1];
  const adg = computeAdgForPond(p, recs);
  return `
    <div class="pond-card" data-open-pond="${p.id}">
      <div class="pond-card-top">
        <div>
          <h3>${escapeHtml(p.name)}</h3>
          <div class="pond-meta">${escapeHtml(p.species||'ยังไม่ระบุชนิด')} ${p.brand ? '· '+escapeHtml(p.brand) : ''}</div>
        </div>
        ${doc!==null ? `<span class="doc-chip">DOC ${doc} วัน</span>` : ''}
      </div>
      <div class="stat-row">
        <div class="stat">
          <div class="label">ไซส์ล่าสุด</div>
          <div class="val">${last ? last.sizeCount+' ตัว/กก.' : '-'}</div>
        </div>
        <div class="stat">
          <div class="label">ADG (ก./วัน)</div>
          <div class="val coral">${adg!==null ? adg.toFixed(2) : '-'}</div>
        </div>
      </div>
    </div>
  `;
}

function renderPondDetail(){
  const p = state.ponds.find(x=>x.id===currentPondId);
  if(!p){ currentPondId = null; return renderFarmDashboard(); }
  const records = recordsForPond(p.id);
  const editingRecordThisRender = editingRecordId ? records.find(r=>r.id===editingRecordId) : null;
  const doc = p.releaseDate ? daysBetween(p.releaseDate, todayISO()) : null;
  const last = records[records.length-1];
  const lastWeight = last ? weightFromCount(last.sizeCount) : null;
  const cumAdg = (lastWeight && doc) ? (lastWeight/doc) : null;

  let weeklyAdg = null;
  if(records.length >= 2){
    const prev = records[records.length-2];
    const dDays = daysBetween(prev.weekDate, last.weekDate);
    const wPrev = weightFromCount(prev.sizeCount), wLast = weightFromCount(last.sizeCount);
    if(dDays>0 && wPrev!==null && wLast!==null) weeklyAdg = (wLast-wPrev)/dDays;
  }

  const rows = records.slice().reverse().map(r=>{

          &nbsp;·&nbsp;
          <button class="btn-danger-text" id="btn-delete-pond">ลบบ่อนี้</button>
        </div>
      </div>

      <div class="summary-strip">

          <div class="n">${last ? last.sizeCount : '-'}</div>
          <div class="l">ตัว/กก. ล่าสุด</div>

        <div class="summary-box amber">
          <div class="n">${last ? last.feedPerDay : '-'}</div>
          <div class="l">กก. อาหาร/วัน</div>
        </div>
        <div class="summary-box coral">
          <div class="n">${weeklyAdg!==null ? weeklyAdg.toFixed(2) : (cumAdg!==null?cumAdg.toFixed(2):'-')}</div>
          <div class="l">ADG (ก./วัน)</div>
        </div>
      </div>

      <div class="card" id="record-form-card">
        <h3>${editingRecordId ? 'แก้ไขข้อมูลบันทึก' : 'บันทึกข้อมูลสัปดาห์นี้'}</h3>
        <form id="record-form">
          <div class="field-row">
            <div class="field">
              <label>วันที่บันทึก</label>
              <input type="date" name="weekDate" id="record-week-date" value="${editingRecordThisRender ? editingRecordThisRender.weekDate : todayISO()}" required>
              <div class="hint" id="record-doc-hint">${p.releaseDate ? 'อายุกุ้ง ณ วันที่บันทึก: '+daysBetween(p.releaseDate, editingRecordThisRender ? editingRecordThisRender.weekDate : todayISO())+' วัน' : 'ยังไม่ได้ระบุวันที่ปล่อยกุ้งของบ่อนี้'}</div>
            </div>
            <div class="field">
              <label>ไซส์กุ้ง (ตัว/กก.)</label>
              <input type="number" inputmode="decimal" step="0.1" name="sizeCount" placeholder="เช่น 60" value="${editingRecordThisRender ? editingRecordThisRender.sizeCount : ''}" required>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>อาหารต่อวัน (กก.)</label>
              <input type="number" inputmode="decimal" step="0.1" name="feedPerDay" placeholder="เช่น 25" value="${editingRecordThisRender ? editingRecordThisRender.feedPerDay : ''}" required>
            </div>
            <div class="field">
              <label>หมายเหตุ (ถ้ามี)</label>
              <input type="text" name="note" placeholder="เช่น น้ำขุ่น, ลดอาหาร" value="${editingRecordThisRender ? escapeHtml(editingRecordThisRender.note||'') : ''}">
            </div>
          </div>
          <div class="btn-row">
            ${editingRecordId ? `<button class="btn btn-secondary" type="button" id="btn-cancel-edit-record" style="flex:1">ยกเลิก</button>` : ''}
            <button class="btn btn-primary" type="submit" style="flex:${editingRecordId?2:1}">${editingRecordId ? 'บันทึกการแก้ไข' : 'บันทึกข้อมูลสัปดาห์นี้'}</button>
          </div>
        </form>
      </div>

      ${records.length>0 ? `
      <div class="card">
        <h3>แนวโน้มไซส์กุ้ง (น้ำหนักเฉลี่ย กรัม)</h3>
        <div class="chart-wrap" id="chart-size"></div>
      </div>
      <div class="card">
        <h3>แนวโน้มอาหารต่อวัน (กก.)</h3>
        <div class="chart-wrap" id="chart-feed"></div>
      </div>
      ${records.length>=2 ? `
      <div class="card">
        <h3>แนวโน้ม ADG รายสัปดาห์ (กรัม/วัน)</h3>
        <div class="chart-wrap" id="chart-adg"></div>
      </div>` : ''}
      <div class="card">
        <h3>ประวัติการบันทึก</h3>
        <div style="overflow-x:auto">
          <table class="rec-table">
            <thead><tr><th>วันที่</th><th>อายุ (DOC)</th><th>ไซส์</th><th>อาหาร/วัน</th><th>หมายเหตุ</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
      ` : `<div class="empty-state">${ICONS.shrimp}<p>ยังไม่มีข้อมูลบันทึก เริ่มกรอกข้อมูลสัปดาห์แรกด้านบนได้เลย</p></div>`}
    </main>
  `;
}

/* ---------------- Charts ---------------- */
function svgLineChart({labels, values, color, fillColor}){
  const width = 600, height = 180;
  const padL = 40, padR = 12, padT = 12, padB = 26;
  const innerW = width - padL - padR;
  const innerH = height - padT - padB;

  const valid = values.map((v,i)=>({v,i})).filter(d=>d.v!==null && d.v!==undefined && !isNaN(d.v));
  if(valid.length===0){
    return `<div style="display:flex;align-items:center;justify-content:center;height:${height}px;color:var(--ink-faint);font-size:12.5px">ยังไม่มีข้อมูลเพียงพอ</div>`;
  }

  let min = Math.min(...valid.map(d=>d.v));
  let max = Math.max(...valid.map(d=>d.v));
  if(min === max){ const bump = Math.abs(min)*0.1 || 1; min -= bump; max += bump; }
  const rangePad = (max-min)*0.15;
  min -= rangePad; max += rangePad;
  if(min < 0 && valid.every(d=>d.v>=0)) min = 0;

  const n = labels.length;
  const xFor = i => n<=1 ? padL+innerW/2 : padL + (innerW * i/(n-1));
  const yFor = v => padT + innerH * (1 - (v-min)/(max-min));

  let gridLines = '';
  const gridCount = 4;
  for(let g=0; g<=gridCount; g++){
    const gv = min + (max-min)*g/gridCount;
    const gy = yFor(gv);
    gridLines += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${width-padR}" y2="${gy.toFixed(1)}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
    gridLines += `<text x="${padL-8}" y="${(gy+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#6E8880">${gv.toFixed(Math.abs(gv)<10?1:0)}</text>`;
  }

  let pathSegments = [], currentSeg = [];
  values.forEach((v,i)=>{
    if(v===null || v===undefined || isNaN(v)){
      if(currentSeg.length) pathSegments.push(currentSeg);
      currentSeg = [];
    } else {
      currentSeg.push([xFor(i), yFor(v)]);
    }
  });
  if(currentSeg.length) pathSegments.push(currentSeg);

  const pointRadius = valid.length<=2 ? 5.5 : 3.5;
  let linesHtml = '', areaHtml = '';
  pathSegments.forEach(seg=>{
    if(seg.length>=2){
      const d = seg.map((p,idx)=> (idx===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
      linesHtml += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
      const areaD = d + ` L${seg[seg.length-1][0].toFixed(1)},${(padT+innerH).toFixed(1)} L${seg[0][0].toFixed(1)},${(padT+innerH).toFixed(1)} Z`;
      areaHtml += `<path d="${areaD}" fill="${fillColor}" stroke="none"/>`;
    }
  });

  let pointsHtml = '';
  valid.forEach(d=>{
    const x = xFor(d.i), y = yFor(d.v);
    pointsHtml += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${pointRadius}" fill="${color}" stroke="#0C1917" stroke-width="1.5"/>`;
  });

  let xLabelsHtml = '';
  const maxLabels = 4;
  const step = Math.max(1, Math.ceil(n/maxLabels));
  labels.forEach((lab,i)=>{
    if(i%step===0 || i===n-1){
      const shortLab = lab.split('(')[0].trim();
      xLabelsHtml += `<text x="${xFor(i).toFixed(1)}" y="${height-6}" text-anchor="middle" font-size="10" fill="#6E8880">${escapeHtml(shortLab)}</text>`;
    }
  });

  return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="width:100%;height:${height}px;display:block">
    ${gridLines}${areaHtml}${linesHtml}${pointsHtml}${xLabelsHtml}
  </svg>`;
}

function drawCharts(){
  const records = recordsForPond(currentPondId);
  if(records.length===0) return;
  const pondForChart = state.ponds.find(x=>x.id===currentPondId);
  const labels = records.map(r=>{
    const d = pondForChart && pondForChart.releaseDate ? daysBetween(pondForChart.releaseDate, r.weekDate) : null;
    return d!==null ? `${fmtDate(r.weekDate)} (DOC ${d})` : fmtDate(r.weekDate);
  });

  const sizeEl = document.getElementById('chart-size');
  if(sizeEl){
    const values = records.map(r=>{ const w=weightFromCount(r.sizeCount); return w? +w.toFixed(2):null; });
    sizeEl.innerHTML = svgLineChart({labels, values, color:'#2FA38C', fillColor:'rgba(47,163,140,.18)'});
  }

  const feedEl = document.getElementById('chart-feed');
  if(feedEl){
    const values = records.map(r=>r.feedPerDay);
    feedEl.innerHTML = svgLineChart({labels, values, color:'#EFB753', fillColor:'rgba(239,183,83,.18)'});
  }

  const adgEl = document.getElementById('chart-adg');
  if(adgEl && records.length>=2){
    const adgData = [null];
    for(let i=1;i<records.length;i++){
      const d = daysBetween(records[i-1].weekDate, records[i].weekDate);
      const w0 = weightFromCount(records[i-1].sizeCount), w1 = weightFromCount(records[i].sizeCount);
      adgData.push((d>0 && w0!==null && w1!==null) ? +(((w1-w0)/d)).toFixed(3) : null);
    }
    adgEl.innerHTML = svgLineChart({labels, values: adgData, color:'#E8815F', fillColor:'rgba(232,129,95,.18)'});
  }
}

function renderPondFormPanel(){
  const p = editingPond || {};
  const speciesOpts = SPECIES_OPTIONS.map(s=>`<option value="${s}" ${p.species===s?'selected':''}>${s}</option>`).join('');
  return `
    <div class="card panel-card">
      <h3>${editingPond? 'แก้ไขข้อมูลบ่อ' : 'เพิ่มบ่อใหม่'}</h3>
      <form id="pond-form">
        <div class="field"><label>ชื่อบ่อ</label><input required name="name" value="${escapeHtml(p.name||'')}" placeholder="เช่น บ่อ 1"></div>
        <div class="field-row">
          <div class="field"><label>วันที่ปล่อยกุ้ง</label><input type="date" name="releaseDate" value="${p.releaseDate||''}"></div>
          <div class="field"><label>ชนิดกุ้ง</label>
            <select name="species"><option value="">เลือกชนิด</option>${speciesOpts}</select>
          </div>
        </div>
        <div class="field"><label>จำนวนที่ปล่อย (ตัว)</label><input type="number" inputmode="numeric" step="1" min="0" name="releaseCount" value="${p.releaseCount||''}" placeholder="เช่น 500000"></div>
        <div class="field"><label>แบรนด์/บริษัทลูกกุ้ง</label><input name="brand" value="${escapeHtml(p.brand||'')}" placeholder="เช่น CP, ITF"></div>
        <div class="btn-row">
          <button class="btn btn-secondary" type="button" id="btn-cancel-pond" style="flex:1">ยกเลิก</button>
          <button class="btn btn-primary" type="submit" style="flex:2">${editingPond?'บันทึกการแก้ไข':'เพิ่มบ่อ'}</button>
        </div>
      </form>
    </div>
  `;
}
function closePondSheet(){ showPondFormSheet=false; editingPond=null; render(); }

/* ---------------- Event binding ---------------- */
function bindDashboardEvents(){
  const btnSettings = document.getElementById('btn-settings');
  if(btnSettings) btnSettings.onclick = ()=>{ showSettingsSheet=true; render(); };

  const btnCloseSettings = document.getElementById('btn-close-settings');
  if(btnCloseSettings) btnCloseSettings.onclick = ()=>{ showSettingsSheet=false; render(); };

  const btnClearData = document.getElementById('btn-clear-data');
  if(btnClearData) btnClearData.onclick = async ()=>{
    if(!confirm('ล้างข้อมูลบ่อและบันทึกทั้งหมด (ฟาร์มจะยังอยู่)? การกระทำนี้ย้อนกลับไม่ได้')) return;
    state.ponds = []; state.records = [];
    await persist();
    showSettingsSheet=false; currentPondId=null; render();
  };

  const pondFormEl = document.getElementById('pond-form');
  if(pondFormEl){
    const cancelPondBtn = document.getElementById('btn-cancel-pond');
    if(cancelPondBtn) cancelPondBtn.onclick = closePondSheet;
    pondFormEl.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(pondFormEl);
      const data = {
        name: fd.get('name').trim(),
        releaseDate: fd.get('releaseDate') || '',
        species: fd.get('species') || '',
        releaseCount: fd.get('releaseCount') ? parseFloat(fd.get('releaseCount')) : null,
        brand: fd.get('brand').trim(),
        farmId: currentFarmId,
      };
      if(editingPond){
        const idx = state.ponds.findIndex(x=>x.id===editingPond.id);
        state.ponds[idx] = {...state.ponds[idx], ...data};
      } else {
        state.ponds.push({id:uid(), ...data});
      }
      await persist();
      closePondSheet();
    });
  }

  document.querySelectorAll('[data-farm]').forEach(btn=>{
    btn.onclick = ()=>{ currentFarmId = btn.getAttribute('data-farm'); currentPondId=null; render(); };
  });

  document.querySelectorAll('[data-rename-farm]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.getAttribute('data-rename-farm');
      const farm = state.farms.find(f=>f.id===id);
      const name = prompt('ชื่อฟาร์มใหม่:', farm ? farm.name : '');
      if(name && name.trim()){
        farm.name = name.trim();
        await persist();
        render();
      }
    };
  });

  const btnAddPond = document.getElementById('btn-add-pond');
  if(btnAddPond) btnAddPond.onclick = ()=>{ editingPond=null; showPondFormSheet=true; render(); };

  document.querySelectorAll('[data-open-pond]').forEach(card=>{
    card.onclick = ()=>{ currentPondId = card.getAttribute('data-open-pond'); editingRecordId=null; render(); };
  });

  const btnBack = document.getElementById('btn-back');
  if(btnBack) btnBack.onclick = ()=>{ currentPondId=null; editingRecordId=null; render(); };

  const btnEditPond = document.getElementById('btn-edit-pond');
  if(btnEditPond) btnEditPond.onclick = ()=>{
    editingPond = state.ponds.find(p=>p.id===currentPondId);
    showPondFormSheet = true;
    render();
  };

  const btnDeletePond = document.getElementById('btn-delete-pond');
  if(btnDeletePond) btnDeletePond.onclick = async ()=>{
    if(!confirm('ลบบ่อนี้และประวัติการบันทึกทั้งหมด? การกระทำนี้ไม่สามารถย้อนกลับได้')) return;
    state.records = state.records.filter(r=>r.pondId!==currentPondId);
    state.ponds = state.ponds.filter(p=>p.id!==currentPondId);
    await persist();
    currentPondId = null;
    render();
  };

  document.querySelectorAll('[data-edit-record]').forEach(btn=>{
    btn.onclick = ()=>{
      editingRecordId = btn.getAttribute('data-edit-record');
      render();
      const card = document.getElementById('record-form-card');
      if(card) card.scrollIntoView({behavior:'smooth', block:'start'});
    };
  });

  const btnCancelEditRecord = document.getElementById('btn-cancel-edit-record');
  if(btnCancelEditRecord) btnCancelEditRecord.onclick = ()=>{ editingRecordId=null; render(); };

  document.querySelectorAll('[data-del-record]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('ลบข้อมูลบันทึกนี้?')) return;
      const id = btn.getAttribute('data-del-record');
      if(editingRecordId === id) editingRecordId = null;
      state.records = state.records.filter(r=>r.id!==id);
      await persist();
      render();
    };
  });

  const recordForm = document.getElementById('record-form');
  if(recordForm){
    const dateInput = document.getElementById('record-week-date');
    const docHint = document.getElementById('record-doc-hint');
    if(dateInput && docHint){
      dateInput.addEventListener('input', ()=>{
        const pond = state.ponds.find(x=>x.id===currentPondId);
        if(pond && pond.releaseDate && dateInput.value){
          docHint.textContent = 'อายุกุ้ง ณ วันที่บันทึก: ' + daysBetween(pond.releaseDate, dateInput.value) + ' วัน';
        }
      });
    }
    recordForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(recordForm);
      const weekDate = fd.get('weekDate');
      const data = {
        pondId: currentPondId,
        weekDate,
        sizeCount: parseFloat(fd.get('sizeCount')),
        feedPerDay: parseFloat(fd.get('feedPerDay')),
        note: (fd.get('note')||'').trim(),
      };
      // avoid two records sharing the same date for this pond
      const conflict = state.records.find(r=>r.pondId===currentPondId && r.weekDate===weekDate && r.id!==editingRecordId);
      if(conflict) state.records = state.records.filter(r=>r.id!==conflict.id);

      if(editingRecordId){
        const target = state.records.find(r=>r.id===editingRecordId);
        if(target) Object.assign(target, data);
        editingRecordId = null;
      } else {
        state.records.push({id:uid(), ...data});
      }
      await persist();
      render();
    });
  }
}

/* ---------------- Go ---------------- */
boot();
</script>

<script>
/* ---------------- PWA: service worker registration + auto-update ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').then((reg)=>{
      setInterval(()=>reg.update(), 60*60*1000);
      reg.addEventListener('updatefound', ()=>{
        const newWorker = reg.installing;
        if(!newWorker) return;
        newWorker.addEventListener('statechange', ()=>{
          if(newWorker.state === 'activated' && navigator.serviceWorker.controller){
            showUpdateToast();
          }
        });
      });
    }).catch((e)=>console.warn('Service worker registration failed', e));
  });
}

function showUpdateToast(){
  if(document.getElementById('update-toast')) return;
  const toast = document.createElement('div');
  toast.id = 'update-toast';
  toast.className = 'update-toast';
  toast.innerHTML = `<span style="flex:1">มีอัปเดตเวอร์ชันใหม่ของแอป</span><button id="update-toast-btn">โหลดใหม่</button>`;
  document.body.appendChild(toast);
  document.getElementById('update-toast-btn').onclick = ()=>location.reload();
}
</script>
