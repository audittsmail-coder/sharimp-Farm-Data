    const biomassCalcFeed = document.getElementById('biomass-calc-feed');
    const biomassFeedPctValue = document.getElementById('biomass-feedpct-value');
    const updateBiomassCalc = ()=>{
      const releaseCount = biomassRelease.value ? parseFloat(biomassRelease.value) : null;
      const survivalRate = biomassSurvival.value ? parseFloat(biomassSurvival.value) : null;
      const sizeCount = biomassSize.value ? parseFloat(biomassSize.value) : null;
      const feedPct = biomassFeedPct.value ? parseFloat(biomassFeedPct.value) : null;

      if(biomassFeedPctValue) biomassFeedPctValue.textContent = feedPct!=null ? feedPct.toFixed(1)+'%' : '-';

      const survivingCount = (releaseCount && survivalRate!=null) ? Math.round(releaseCount*(survivalRate/100)) : null;
      biomassCalcSurviving.textContent = survivingCount!=null ? survivingCount.toLocaleString('th-TH')+' ตัว' : '-';

      const weightG = sizeCount ? weightFromCount(sizeCount) : null;
      biomassCalcWeight.textContent = weightG!=null ? weightG.toFixed(1)+' ก.' : '-';

      const biomassKg = (releaseCount && survivalRate!=null && sizeCount) ? estimatedBiomassKg(releaseCount, survivalRate, sizeCount) : null;
      biomassCalcBiomass.textContent = biomassKg!=null ? biomassKg.toLocaleString('th-TH',{maximumFractionDigits:1})+' กก.' : '-';

      const feedKg = (biomassKg!=null && feedPct!=null) ? biomassKg * (feedPct/100) : null;
      biomassCalcFeed.textContent = feedKg!=null ? feedKg.toLocaleString('th-TH',{maximumFractionDigits:1})+' กก.' : '-';
    };
    [biomassRelease, biomassSurvival, biomassSize, biomassFeedPct].forEach(el=>el.addEventListener('input', updateBiomassCalc));
    updateBiomassCalc();
  }

  const closeForm = document.getElementById('close-form');
  if(closeForm){
    const cDate = closeForm.querySelector('#close-date');
    const cDoc = closeForm.querySelector('#close-doc');
    const cReleaseCount = closeForm.querySelector('#close-releasecount');
    const cSize = closeForm.querySelector('#close-size');
    const cPrice = closeForm.querySelector('#close-price');
    const cWeight = closeForm.querySelector('#close-weight');
    const cFeed = closeForm.querySelector('#close-feed');
    const calcCount = document.getElementById('close-calc-count');
    const calcSurvival = document.getElementById('close-calc-survival');
    const calcFcr = document.getElementById('close-calc-fcr');
    const calcValue = document.getElementById('close-calc-value');

    const pond = state.ponds.find(x=>x.id===viewingClosePondId);
    const priorHarvests = pond ? harvestsForPond(pond.id) : [];
    const priorCaughtCount = priorHarvests.reduce((sum,h)=> sum + (h.caughtCount||0), 0);
    const priorKg = priorHarvests.reduce((sum,h)=> sum + (h.weightKg||0), 0);
    const priorRevenue = priorHarvests.reduce((sum,h)=> sum + (h.revenue||0), 0);

    let docManuallyEdited = false;
    if(cDoc) cDoc.addEventListener('input', ()=>{ docManuallyEdited = true; });
    if(cDate && cDoc && pond && pond.releaseDate){
      cDate.addEventListener('input', ()=>{
        if(docManuallyEdited || !cDate.value) return;
        cDoc.value = daysBetween(pond.releaseDate, cDate.value);
      });
    }

    const updateCalc = ()=>{
      const releaseCount = cReleaseCount.value ? parseFloat(cReleaseCount.value) : null;
      const sizeCount = cSize.value ? parseFloat(cSize.value) : null;
      const pricePerKg = cPrice.value ? parseFloat(cPrice.value) : null;
      const weightKg = cWeight.value ? parseFloat(cWeight.value) : null;
      const totalFeedKg = cFeed.value ? parseFloat(cFeed.value) : null;

      const thisCaughtCount = (weightKg && sizeCount) ? weightKg * sizeCount : null;
      const totalCaughtCount = (thisCaughtCount!==null || priorCaughtCount) ? priorCaughtCount + (thisCaughtCount||0) : null;
      calcCount.textContent = totalCaughtCount!==null ? Math.round(totalCaughtCount).toLocaleString('th-TH')+' ตัว' : '-';

      if(totalCaughtCount!==null && releaseCount){
        calcSurvival.textContent = (totalCaughtCount / releaseCount * 100).toFixed(1) + '%';
      } else {
        calcSurvival.textContent = '-';
      }

      const totalWeightKg = priorKg + (weightKg||0);
      calcFcr.textContent = (totalFeedKg && totalWeightKg) ? (totalFeedKg / totalWeightKg).toFixed(2) : '-';

      const thisRevenue = (weightKg && pricePerKg) ? weightKg*pricePerKg : null;
      const totalRevenue = (thisRevenue!==null || priorRevenue) ? priorRevenue + (thisRevenue||0) : null;
      calcValue.textContent = totalRevenue!==null ? totalRevenue.toLocaleString('th-TH',{maximumFractionDigits:0})+' บ.' : '-';
    };
    [cReleaseCount, cSize, cPrice, cWeight, cFeed].forEach(el=>{ if(el) el.addEventListener('input', updateCalc); });
    updateCalc();

    closeForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(!pond) return;
      const fd = new FormData(closeForm);
      const closeDate = fd.get('closeDate');
      const doc = fd.get('doc') ? parseFloat(fd.get('doc')) : null;
      const farmName = (fd.get('farmName')||'').trim();
      const pondName = (fd.get('pondName')||'').trim();
      const releaseCount = fd.get('releaseCount') ? parseFloat(fd.get('releaseCount')) : null;
      const species = (fd.get('species')||'').trim();
      const hatchery = (fd.get('hatchery')||'').trim();
      const sizeCount = fd.get('sizeCount') ? parseFloat(fd.get('sizeCount')) : null;
      const pricePerKg = fd.get('pricePerKg') ? parseFloat(fd.get('pricePerKg')) : null;
      const weightKg = fd.get('weightKg') ? parseFloat(fd.get('weightKg')) : null;
      const totalFeedKg = fd.get('totalFeedKg') ? parseFloat(fd.get('totalFeedKg')) : null;

      const thisCaughtCount = (weightKg && sizeCount) ? weightKg * sizeCount : null;
      const totalCaughtCount = (thisCaughtCount!==null || priorCaughtCount) ? priorCaughtCount + (thisCaughtCount||0) : null;
      const survivalRatePct = (totalCaughtCount!==null && releaseCount) ? (totalCaughtCount / releaseCount * 100) : null;
      const totalWeightKg = priorKg + (weightKg||0);
      const fcr = (totalFeedKg && totalWeightKg) ? (totalFeedKg / totalWeightKg) : null;
      const thisRevenue = (weightKg && pricePerKg) ? weightKg * pricePerKg : null;
      const totalRevenue = (thisRevenue!==null || priorRevenue) ? priorRevenue + (thisRevenue||0) : null;

      const data = {
        pondId: pond.id, farmId: pond.farmId,
        closeDate, doc, farmName, pondName, releaseCount, species, hatchery,
        sizeCount, pricePerKg, weightKg: totalWeightKg, totalFeedKg,
        caughtCount: totalCaughtCount, survivalRatePct, fcr, revenue: totalRevenue,
        createdAt: Date.now(),
      };
      try{
        await db.collection('closures').add(data);
        await archivePondCycle(pond);
      }catch(e){ alert('บันทึกไม่สำเร็จ: '+e.message); }
      viewingClosePondId = null;
      currentPondId = null;
      render();
    });
  }

  bindClickByIds(['btn-back-close-edit','btn-back-close-edit-bottom'], ()=>{ editingClosureId = null; render(); });

  const closeEditForm = document.getElementById('close-edit-form');
  if(closeEditForm){
    const eSize = closeEditForm.querySelector('#close-edit-size');
    const ePrice = closeEditForm.querySelector('#close-edit-price');
    const eWeight = closeEditForm.querySelector('#close-edit-weight');
    const eFeed = closeEditForm.querySelector('#close-edit-feed');
    const eReleaseCount = closeEditForm.querySelector('#close-edit-releasecount');
    const eCalcCount = document.getElementById('close-edit-calc-count');
    const eCalcSurvival = document.getElementById('close-edit-calc-survival');
    const eCalcFcr = document.getElementById('close-edit-calc-fcr');
    const eCalcValue = document.getElementById('close-edit-calc-value');

    const updateEditCalc = ()=>{
      const releaseCount = eReleaseCount.value ? parseFloat(eReleaseCount.value) : null;
      const sizeCount = eSize.value ? parseFloat(eSize.value) : null;
      const pricePerKg = ePrice.value ? parseFloat(ePrice.value) : null;
      const weightKg = eWeight.value ? parseFloat(eWeight.value) : null;
      const totalFeedKg = eFeed.value ? parseFloat(eFeed.value) : null;

      const caughtCount = (weightKg && sizeCount) ? weightKg * sizeCount : null;
      eCalcCount.textContent = caughtCount!==null ? Math.round(caughtCount).toLocaleString('th-TH')+' ตัว' : '-';
      eCalcSurvival.textContent = (caughtCount!==null && releaseCount) ? (caughtCount / releaseCount * 100).toFixed(1) + '%' : '-';
      eCalcFcr.textContent = (totalFeedKg && weightKg) ? (totalFeedKg / weightKg).toFixed(2) : '-';
      eCalcValue.textContent = (weightKg && pricePerKg) ? (weightKg*pricePerKg).toLocaleString('th-TH',{maximumFractionDigits:0})+' บ.' : '-';
    };
    [eReleaseCount, eSize, ePrice, eWeight, eFeed].forEach(el=>{ if(el) el.addEventListener('input', updateEditCalc); });
    updateEditCalc();

    closeEditForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const id = editingClosureId;
      if(!id) return;
      const fd = new FormData(closeEditForm);
      const closeDate = fd.get('closeDate');
      const doc = fd.get('doc') ? parseFloat(fd.get('doc')) : null;
      const farmName = (fd.get('farmName')||'').trim();
      const pondName = (fd.get('pondName')||'').trim();
      const releaseCount = fd.get('releaseCount') ? parseFloat(fd.get('releaseCount')) : null;
      const species = (fd.get('species')||'').trim();
      const hatchery = (fd.get('hatchery')||'').trim();
      const sizeCount = fd.get('sizeCount') ? parseFloat(fd.get('sizeCount')) : null;
      const pricePerKg = fd.get('pricePerKg') ? parseFloat(fd.get('pricePerKg')) : null;
      const weightKg = fd.get('weightKg') ? parseFloat(fd.get('weightKg')) : null;
      const totalFeedKg = fd.get('totalFeedKg') ? parseFloat(fd.get('totalFeedKg')) : null;

      const caughtCount = (weightKg && sizeCount) ? weightKg * sizeCount : null;
      const survivalRatePct = (caughtCount!==null && releaseCount) ? (caughtCount / releaseCount * 100) : null;
      const fcr = (totalFeedKg && weightKg) ? (totalFeedKg / weightKg) : null;
      const revenue = (weightKg && pricePerKg) ? weightKg * pricePerKg : null;

      const data = {
        closeDate, doc, farmName, pondName, releaseCount, species, hatchery,
        sizeCount, pricePerKg, weightKg, totalFeedKg,
        caughtCount, survivalRatePct, fcr, revenue,
      };
      try{
        await db.collection('closures').doc(id).update(data);
      }catch(e){ alert('บันทึกไม่สำเร็จ: '+e.message); }
      editingClosureId = null;
      render();
    });
  }

  document.querySelectorAll('[data-del-harvest]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('ลบประวัติการแบ่งจับนี้?')) return;
      const id = btn.getAttribute('data-del-harvest');
      await db.collection('harvests').doc(id).delete()
        .catch((e)=>alert('ลบไม่สำเร็จ: '+e.message));
      render();
    };
  });

  const harvestForm = document.getElementById('harvest-form');
  if(harvestForm){
    const hWeightInput = harvestForm.querySelector('input[name=weightKg]');
    const hSizeInput = harvestForm.querySelector('input[name=sizeCount]');
    const hPreviewRemaining = document.getElementById('harvest-preview-remaining');
    const hPreviewCaption = document.getElementById('harvest-preview-caption');
    if(hWeightInput && hSizeInput && hPreviewRemaining && hPreviewCaption){
      const updateHarvestPreview = ()=>{
        const pond = state.ponds.find(x=>x.id===viewingHarvestPondId);
        if(!pond) return;
        const records = recordsForPond(pond.id);
        const last = records[records.length-1];
        const pondHarvests = harvestsForPond(pond.id);
        const totalHarvestedCount = pondHarvests.reduce((sum,h)=> sum + (h.caughtCount||0), 0);
        const rawSurvivingCount = last ? estimatedSurvivingCount(pond.releaseCount, last.survivalRate) : null;
        const currentRemaining = rawSurvivingCount!==null ? Math.max(0, rawSurvivingCount - totalHarvestedCount) : null;
        const weightKg = hWeightInput.value ? parseFloat(hWeightInput.value) : null;
        const sizeCount = hSizeInput.value ? parseFloat(hSizeInput.value) : null;
        if(currentRemaining!==null && weightKg && sizeCount){
          const caughtCount = weightKg * sizeCount;
          const remainingAfter = Math.max(0, currentRemaining - caughtCount);
          const survivalRateAfter = pond.releaseCount ? (remainingAfter / pond.releaseCount * 100) : null;
          hPreviewRemaining.textContent = remainingAfter.toLocaleString('th-TH',{maximumFractionDigits:0}) + ' ตัว';
          hPreviewCaption.textContent = `จับได้ประมาณ ${caughtCount.toLocaleString('th-TH',{maximumFractionDigits:0})} ตัว${survivalRateAfter!==null ? ` · อัตรารอดเหลือ ${survivalRateAfter.toFixed(1)}%` : ''}`;
        } else {
          hPreviewRemaining.textContent = '-';
          hPreviewCaption.textContent = 'ใส่น้ำหนักและไซส์ที่จับเพื่อคำนวณ';
        }
      };
      hWeightInput.addEventListener('input', updateHarvestPreview);
      hSizeInput.addEventListener('input', updateHarvestPreview);
    }
    harvestForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const pond = state.ponds.find(x=>x.id===viewingHarvestPondId);
      if(!pond) return;
      const fd = new FormData(harvestForm);
      const harvestDate = fd.get('harvestDate');
      const weightKg = parseFloat(fd.get('weightKg'));
      const sizeCount = parseFloat(fd.get('sizeCount'));
      const pricePerKg = fd.get('pricePerKg') ? parseFloat(fd.get('pricePerKg')) : null;
      const note = (fd.get('note')||'').trim();

      const records = recordsForPond(pond.id);
      const last = records[records.length-1];
      const pondHarvests = harvestsForPond(pond.id);
      const totalHarvestedCount = pondHarvests.reduce((sum,h)=> sum + (h.caughtCount||0), 0);
      const rawSurvivingCount = last ? estimatedSurvivingCount(pond.releaseCount, last.survivalRate) : null;
      const currentRemaining = rawSurvivingCount!==null ? Math.max(0, rawSurvivingCount - totalHarvestedCount) : null;

      const caughtCount = weightKg * sizeCount;
      const remainingAfter = currentRemaining!==null ? Math.max(0, currentRemaining - caughtCount) : null;
      const survivalRateAfter = (remainingAfter!==null && pond.releaseCount) ? (remainingAfter / pond.releaseCount * 100) : null;
      const revenue = pricePerKg!=null ? weightKg * pricePerKg : null;

      const data = {
        pondId: pond.id, harvestDate, weightKg, sizeCount,
        pricePerKg, revenue, caughtCount, remainingAfter, survivalRateAfter,
        note, createdAt: Date.now(),
      };
      await db.collection('harvests').add(data).catch((e)=>alert('บันทึกไม่สำเร็จ: '+e.message));
      render();
    });
  }

  bindClickByIds(['btn-back-batch','btn-back-batch-bottom'], ()=>{ viewingBatchId=null; render(); });

  document.querySelectorAll('[data-view-batch]').forEach(btn=>{
    btn.onclick = ()=>{ viewingBatchId = btn.getAttribute('data-view-batch'); render(); };
  });

  document.querySelectorAll('[data-del-batch]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('ลบประวัติรุ่นนี้ถาวร?')) return;
      const id = btn.getAttribute('data-del-batch');
      await db.collection('batches').doc(id).delete()
        .catch((e)=>alert('ลบไม่สำเร็จ: '+e.message));
      render();
    };
  });

  document.querySelectorAll('[data-edit-record]').forEach(btn=>{
    btn.onclick = ()=>{
      editingRecordId = btn.getAttribute('data-edit-record');
      render();
      const card = document.getElementById('record-form-card');
      if(card) card.scrollIntoView({behavior:'smooth', block:'start'});
    };
  });

  const btnCancelEditRecord = document.getElementById('btn-cancel-edit-record');
  if(btnCancelEditRecord) btnCancelEditRecord.onclick = ()=>{ editingRecordId=null; render(); };

  document.querySelectorAll('[data-del-record]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('ลบข้อมูลบันทึกนี้?')) return;
      const id = btn.getAttribute('data-del-record');
      if(editingRecordId === id) editingRecordId = null;
      await db.collection('records').doc(id).delete()
        .catch((e)=>alert('ลบไม่สำเร็จ: '+e.message));
      render();
    };
  });

  const recordForm = document.getElementById('record-form');
  if(recordForm){
    const dateInput = document.getElementById('record-week-date');
    const docHint = document.getElementById('record-doc-hint');
    if(dateInput && docHint){
      dateInput.addEventListener('input', ()=>{
        const pond = state.ponds.find(x=>x.id===currentPondId);
        if(pond && pond.releaseDate && dateInput.value){
          docHint.textContent = 'อายุกุ้ง ณ วันที่บันทึก: ' + daysBetween(pond.releaseDate, dateInput.value) + ' วัน';
        }
      });
    }

    const sizeCountInput = recordForm.querySelector('input[name=sizeCount]');
    const survivalRateInput = recordForm.querySelector('input[name=survivalRate]');
    const yieldValueEl = document.getElementById('yield-value');
    const yieldCaptionEl = document.getElementById('yield-caption');
    const survivalCountEl = document.getElementById('survival-count-value');
    if(sizeCountInput && survivalRateInput && yieldValueEl && yieldCaptionEl){
      const updateYieldPreview = ()=>{
        const pond = state.ponds.find(x=>x.id===currentPondId);
        const sizeCount = sizeCountInput.value ? parseFloat(sizeCountInput.value) : null;
        const survivalRate = survivalRateInput.value ? parseFloat(survivalRateInput.value) : null;
        const totalHarvestedCount = pond ? harvestsForPond(pond.id).reduce((sum,h)=> sum + (h.caughtCount||0), 0) : 0;
        const rawSurvivingCount = pond ? estimatedSurvivingCount(pond.releaseCount, survivalRate) : null;
        const survivingCount = rawSurvivingCount!==null ? Math.max(0, rawSurvivingCount - totalHarvestedCount) : null;
        const weightG = sizeCount ? weightFromCount(sizeCount) : null;
        const kg = (survivingCount!==null && weightG!==null) ? survivingCount * weightG / 1000 : null;
        if(kg!==null){
          yieldValueEl.textContent = kg.toLocaleString('th-TH',{maximumFractionDigits:1}) + ' กก.';
          yieldCaptionEl.textContent = totalHarvestedCount>0 ? `อัตรารอด ${survivalRate}% − แบ่งจับสะสม ${totalHarvestedCount.toLocaleString('th-TH')} ตัว` : `คำนวณจากจำนวนปล่อย × อัตรารอด ${survivalRate}% × ไซส์ที่กรอก`;
        } else {
          yieldValueEl.textContent = '-';
          yieldCaptionEl.textContent = 'ใส่อัตรารอดด้านล่างเพื่อคำนวณผลผลิตโดยประมาณ';
        }
        if(survivalCountEl){
          survivalCountEl.textContent = survivingCount!==null ? survivingCount.toLocaleString('th-TH')+' ตัว' : '-';
        }
      };
      sizeCountInput.addEventListener('input', updateYieldPreview);
      survivalRateInput.addEventListener('input', updateYieldPreview);
    }
    recordForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(recordForm);
      const weekDate = fd.get('weekDate');
      const data = {
        pondId: currentPondId,
        weekDate,
        sizeCount: fd.get('sizeCount') ? parseFloat(fd.get('sizeCount')) : null,
        feedPerDay: parseFloat(fd.get('feedPerDay')),
        totalFeedKg: fd.get('totalFeedKg') ? parseFloat(fd.get('totalFeedKg')) : null,
        survivalRate: fd.get('survivalRate') ? parseFloat(fd.get('survivalRate')) : null,
        note: (fd.get('note')||'').trim(),
        updatedAt: Date.now(),
      };
      // avoid two records sharing the same date for this pond
      const conflict = state.records.find(r=>r.pondId===currentPondId && r.weekDate===weekDate && r.id!==editingRecordId);
      const batch = db.batch();
      if(conflict) batch.delete(db.collection('records').doc(conflict.id));

      if(editingRecordId){
        batch.set(db.collection('records').doc(editingRecordId), data);
        editingRecordId = null;
      } else {
        batch.set(db.collection('records').doc(), data);
      }
      await batch.commit().catch((e)=>alert('บันทึกไม่สำเร็จ: '+e.message));
      render();
    });
  }
}

/* ---------------- Go ---------------- */
boot();
initWeather();
</script>

<script>
/* ---------------- PWA: service worker registration + auto-update ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    const hadController = !!navigator.serviceWorker.controller;
    // Stamp the registration URL with the build version. Some browsers are
    // unreliable about byte-comparing a static './sw.js' URL to notice an
    // update (can silently keep an old worker in control indefinitely,
    // even with skipWaiting/clients.claim on the new one). Changing the
    // URL itself forces a real install check every deploy instead of
    // depending on that comparison.
    navigator.serviceWorker.register('./sw.js?v=' + encodeURIComponent(APP_VERSION)).then((reg)=>{
      reg.update();
      setInterval(()=>reg.update(), 30*60*1000);
      document.addEventListener('visibilitychange', ()=>{
        if(document.visibilityState === 'visible') reg.update();
      });
      reg.addEventListener('updatefound', ()=>{
        const newWorker = reg.installing;
        if(!newWorker) return;
        newWorker.addEventListener('statechange', ()=>{
          if(newWorker.state === 'activated' && hadController){
            showUpdateToast();
          }
        });
      });
    }).catch((e)=>console.warn('Service worker registration failed', e));
  });
}

function showUpdateToast(){
  if(document.getElementById('update-toast')) return;
  const toast = document.createElement('div');
  toast.id = 'update-toast';
  toast.className = 'update-toast';
  toast.innerHTML = `<span style="flex:1">มีอัปเดตเวอร์ชันใหม่ของแอป</span><button id="update-toast-btn">โหลดใหม่</button>`;
  document.body.appendChild(toast);
  document.getElementById('update-toast-btn').onclick = ()=>location.reload();
}
</script>
