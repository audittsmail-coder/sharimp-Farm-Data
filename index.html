<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>บันทึกฟาร์มกุ้งรายสัปดาห์</title>
<meta name="description" content="แอปบันทึกข้อมูลฟาร์มกุ้งรายสัปดาห์ ติดตามไซส์กุ้ง อาหาร และ ADG ใช้งานได้แบบออฟไลน์">
<meta name="theme-color" content="#1F6E5F">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ฟาร์มกุ้ง">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1614;
    --bg-grad:radial-gradient(1200px 600px at 50% -10%, rgba(47,163,140,.12), transparent 60%);
    --surface:#132622;
    --surface-soft:#18332C;
    --surface-hi:#1E3A32;
    --ink:#F1F7F4;
    --ink-soft:#9FB7AE;
    --ink-faint:#6E8880;
    --teal-900:#081A18;
    --teal-700:#1B4F46;
    --teal-600:#1F6E5F;
    --teal-500:#2FA38C;
    --teal-400:#4CC0A6;
    --heading:#8FE0CB;
    --teal-100:rgba(47,163,140,.16);
    --coral:#E8815F;
    --coral-hi:#F0946F;
    --coral-soft:rgba(232,129,95,.16);
    --amber:#EFB753;
    --amber-soft:rgba(239,183,83,.16);
    --orange:#EA8C3B;
    --orange-hi:#F2A25C;
    --orange-soft:rgba(234,140,59,.16);
    --line:#22403A;
    --line-soft:#1B322C;
    --danger:#E2695A;
    --radius-sm:10px;
    --radius:16px;
    --radius-lg:20px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.24);
    --shadow:0 2px 4px rgba(0,0,0,.24), 0 12px 28px rgba(0,0,0,.32);
    --shadow-lg:0 8px 16px rgba(0,0,0,.28), 0 24px 48px rgba(0,0,0,.4);
    --ease:cubic-bezier(.25,.8,.35,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Thai', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{ font-family:'Taviraj', serif; font-weight:600; letter-spacing:.2px; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; }
  ::selection{ background:var(--teal-500); color:#04120F; }

  #app{
    max-width:720px; margin:0 auto; min-height:100vh; background:var(--bg);
    background-image:var(--bg-grad);
    display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }

  .app-banner{
    background:var(--teal-100); color:var(--heading); font-size:12px; text-align:center;
    padding:8px 10px; font-weight:600; letter-spacing:.01em;
    border-bottom:1px solid rgba(143,224,203,.12);
  }
  .app-banner.warn{ background:var(--amber-soft); color:#F0C878; border-bottom-color:rgba(239,183,83,.2); }

  .topbar{
    background:linear-gradient(155deg, var(--teal-500) 0%, var(--teal-600) 55%, var(--teal-700) 100%);
    color:#fff;
    padding:16px 18px;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 4px 20px rgba(4,20,17,.35);
  }
  .topbar .wave{
    width:30px; height:30px; flex:none; padding:5px; border-radius:10px;
    background:rgba(255,255,255,.14);
  }
  .topbar h1{ font-size:19.5px; margin:0; color:#fff; flex:1; letter-spacing:.1px; }
  .topbar .sub{ font-size:11.5px; color:rgba(255,255,255,.8); margin-top:2px; font-weight:500; }
  .icon-btn{
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#fff;
    width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none; transition:background .15s var(--ease), transform .15s var(--ease);
  }
  .icon-btn:hover{ background:rgba(255,255,255,.18); }
  .icon-btn:active{ transform:scale(.92); }

  .backbar{ display:flex; align-items:center; gap:8px; padding:14px 16px 0 16px; }
  .back-btn{
    background:var(--surface); border:1px solid var(--line); color:var(--heading); font-size:13.5px; font-weight:600;
    display:flex; align-items:center; gap:5px; cursor:pointer; padding:7px 12px 7px 8px; border-radius:999px;
    transition:background .15s var(--ease);
  }
  .back-btn:active{ background:var(--surface-soft); }

  main{ flex:1; padding:16px 16px 32px 16px; animation:viewIn .28s var(--ease); }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

  .farm-tabs{ display:flex; gap:8px; overflow-x:auto; padding:14px 16px 4px 16px; -webkit-overflow-scrolling:touch; }
  .farm-tabs::-webkit-scrollbar{ display:none; }
  .farm-tab{
    flex:none; padding:8px 15px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); font-size:13.5px; font-weight:500;
    cursor:pointer; white-space:nowrap; transition:all .18s var(--ease);
  }
  .farm-tab:hover{ border-color:var(--teal-500); color:var(--ink); }
  .farm-tab.active{
    background:linear-gradient(135deg, var(--teal-500), var(--teal-600));
    border-color:transparent; color:#fff; box-shadow:0 4px 14px rgba(47,163,140,.35);
    font-weight:600;
  }

  .farm-title-row{ display:flex; align-items:center; justify-content:space-between; margin:8px 0 14px 0; }
  .farm-title-row h2{ font-size:21px; margin:0; color:var(--heading); }
  .farm-title-row button{
    background:var(--surface-soft); border:1px solid var(--line); color:var(--ink-soft); font-size:12px;
    cursor:pointer; padding:6px 11px; border-radius:999px; font-weight:500; transition:all .15s var(--ease);
  }
  .farm-title-row button:hover{ color:var(--heading); border-color:var(--teal-500); }


  .pond-grid{ display:grid; grid-template-columns:1fr; gap:10px; }
  .pond-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 15px; box-shadow:var(--shadow-sm); cursor:pointer; position:relative;
    transition:transform .16s var(--ease), box-shadow .16s var(--ease), border-color .16s var(--ease);
  }
  .pond-card::before{
    content:''; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:3px;
    background:linear-gradient(var(--teal-400), var(--teal-600)); opacity:.85;
  }
  .pond-card{ padding-left:19px; }
  .pond-card:hover{ border-color:var(--teal-500); box-shadow:var(--shadow); transform:translateY(-1px); }
  .pond-card:active{ transform:scale(.99); }
  .pond-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .pond-card h3{ margin:0; font-size:16.5px; color:var(--heading); }
  .pond-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .doc-chip{ background:var(--teal-100); color:var(--teal-400); font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; flex:none; letter-spacing:.01em; }
  .stat-row{ display:flex; gap:8px; margin-top:10px; }
  .stat{ flex:1; background:var(--surface-soft); border-radius:var(--radius-sm); padding:7px 10px; border:1px solid var(--line-soft); }
  .stat .label{ font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  .stat .val{ font-size:17px; font-weight:700; color:var(--ink); margin-top:1px; font-family:'Taviraj',serif; }
  .stat .val.coral{ color:var(--coral); }
  .stat .val.amber{ color:var(--amber); }
  .empty-state{ text-align:center; padding:56px 20px; color:var(--ink-faint); }
  .empty-state svg{ margin-bottom:12px; opacity:.6; }
  .empty-state p{ font-size:13.5px; margin:4px 0; line-height:1.6; }
  .empty-state p b{ color:var(--ink-soft); }

  .fab{
    width:100%; margin-top:16px;
    background:linear-gradient(135deg, var(--coral-hi), var(--coral)); color:#fff; border:none; border-radius:var(--radius);
    padding:14px 16px; font-size:14.5px; font-weight:700; box-shadow:0 8px 22px rgba(232,129,95,.3);
    display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
    transition:transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  .fab:hover{ box-shadow:0 10px 26px rgba(232,129,95,.4); }
  .fab:active{ transform:scale(.98); }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px;
    box-shadow:var(--shadow-sm); margin-bottom:14px;
  }
  .card h3{ margin:0 0 14px 0; font-size:15.5px; color:var(--heading); display:flex; align-items:center; gap:7px;}
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; font-weight:500; }
  .field input, .field select, .field textarea{
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:var(--radius-sm);
    font-size:14.5px; color:var(--ink); background:var(--surface-soft);
    transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .field input::placeholder, .field textarea::placeholder{ color:var(--ink-faint); }
  .field select{ color-scheme:dark; }
  .field input[type=date]{ color-scheme:dark; }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--teal-500); box-shadow:0 0 0 3px rgba(47,163,140,.22);
  }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .hint{ font-size:11.5px; color:var(--ink-faint); margin-top:5px; }

  .btn{ border:none; border-radius:var(--radius-sm); padding:12px 16px; font-size:14px; font-weight:600; cursor:pointer; transition:transform .12s var(--ease), background .15s var(--ease), opacity .15s var(--ease); }
  .btn-primary{ background:linear-gradient(135deg, var(--teal-500), var(--teal-600)); color:#fff; width:100%; box-shadow:0 6px 16px rgba(31,110,95,.35); }
  .btn-primary:hover{ box-shadow:0 8px 20px rgba(31,110,95,.45); }
  .btn-primary:active{ transform:scale(.98); }
  .btn-primary:disabled{ opacity:.6; cursor:default; transform:none; }
  .btn-secondary{ background:var(--surface-soft); color:var(--ink); border:1px solid var(--line); }
  .btn-secondary:hover{ border-color:var(--teal-500); }
  .btn-danger-text{ background:none; color:var(--danger); font-weight:600; font-size:13px; text-decoration:underline; cursor:pointer; border:none; padding:0; }
  .btn-block{ width:100%; }
  .btn-row{ display:flex; gap:10px; margin-top:4px; }

  .pond-head{ margin-bottom:4px; }
  .pond-head h2{ font-size:22px; margin:0; color:var(--heading); }
  .tag-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .tag{ background:var(--surface-soft); color:var(--ink); font-size:14.5px; padding:7px 14px; border-radius:999px; border:1px solid var(--line-soft); font-weight:600; }
  .tag.coral{ background:var(--coral-soft); color:var(--coral); border-color:transparent; }
  .tag.amber{ background:var(--amber-soft); color:var(--amber); border-color:transparent; }
  .tag.good{ background:var(--teal-100); color:var(--teal-400); border-color:transparent; }

  .pathogen-chip{
    display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px;
    letter-spacing:.01em; white-space:nowrap;
  }
  .pathogen-chip.coral{ background:var(--coral-soft); color:var(--coral); }
  .pathogen-chip.amber{ background:var(--amber-soft); color:var(--amber); }
  .pathogen-chip.good{ background:var(--teal-100); color:var(--teal-400); }

  .pathogen-list{ display:flex; flex-direction:column; gap:10px; }
  .pathogen-entry{
    border-left:3px solid var(--line); padding:9px 12px; border-radius:8px;
    background:var(--surface-soft);
  }
  .pathogen-entry.coral{ border-left-color:var(--coral); }
  .pathogen-entry.amber{ border-left-color:var(--amber); }
  .pathogen-entry.good{ border-left-color:var(--teal-500); }
  .pathogen-entry .pe-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:5px; }
  .pathogen-entry .pe-date{ font-size:11.5px; color:var(--ink-faint); font-weight:600; }
  .pathogen-entry .pe-worse{ font-size:10.5px; color:var(--coral); font-weight:700; }
  .pathogen-entry .pe-text{ font-size:13.5px; color:var(--ink); line-height:1.55; }

  /* Harvest ("แบ่งจับ") page: orange accent so it visually reads as a distinct mode */
  .harvest-page{ display:contents; }
  .harvest-page .back-btn{ color:var(--orange); border-color:rgba(234,140,59,.35); }
  .harvest-page .pond-head h2{ color:var(--orange); }
  .harvest-page .card h3{ color:var(--orange); }
  .harvest-page .card{ border-color:rgba(234,140,59,.18); }
  .harvest-page .btn-primary{ background:linear-gradient(135deg, var(--orange), #C46A1F); box-shadow:0 6px 16px rgba(234,140,59,.35); }
  .harvest-page .btn-primary:hover{ box-shadow:0 8px 20px rgba(234,140,59,.45); }
  .harvest-page .field input:focus, .harvest-page .field select:focus, .harvest-page .field textarea:focus{
    border-color:var(--orange); box-shadow:0 0 0 3px rgba(234,140,59,.22);
  }
  .harvest-page table.rec-table th{ color:var(--orange); opacity:.85; }

  .summary-strip{ display:flex; gap:10px; margin:16px 0; }
  .summary-box{
    flex:1; background:linear-gradient(150deg, var(--teal-500), var(--teal-700)); color:#fff;
    border-radius:var(--radius); padding:13px; text-align:center; box-shadow:var(--shadow-sm);
  }
  .summary-box .n{ font-size:20px; font-weight:700; font-family:'Taviraj',serif; }
  .summary-box .l{ font-size:10.5px; opacity:.8; margin-top:3px; font-weight:500; }
  .summary-box.coral{ background:linear-gradient(150deg, var(--coral-hi), #C6603C); }
  .summary-box.amber{ background:linear-gradient(150deg, #F4C878, var(--amber)); color:#3A2A08; }

  .chart-wrap{ position:relative; height:180px; margin-top:8px; }

  table.rec-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.rec-table th{ text-align:left; color:var(--ink-faint); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; padding:8px 7px; border-bottom:1px solid var(--line); }
  table.rec-table td{ padding:10px 7px; border-bottom:1px solid var(--line-soft); color:var(--ink); }
  table.rec-table tr:last-child td{ border-bottom:none; }
  table.rec-table tr:hover td{ background:var(--surface-soft); }
  .row-del{ color:var(--danger); font-size:11px; background:none; border:none; cursor:pointer; text-decoration:underline;}

  .overview-table tbody tr:not(.ov-zone-row){ cursor:pointer; }
  .overview-table th:nth-child(n+2), .overview-table td:nth-child(n+2){ text-align:right; }
  .ov-pond-name{ font-weight:600; color:var(--heading); font-size:13.5px; }
  .ov-pond-species{ font-size:11px; color:var(--ink-faint); margin-top:1px; }
  .ov-update-badge{
    display:inline-block; font-size:9.5px; font-weight:700; color:var(--coral);
    background:var(--coral-soft); padding:2px 7px; border-radius:999px; vertical-align:middle;
    letter-spacing:.02em;
  }
  .ov-adg{ color:var(--coral); font-weight:700; }
  .overview-table tr.ov-zone-row td{
    background:var(--surface-hi); color:var(--teal-400); font-weight:700; font-size:11.5px;
    text-transform:uppercase; letter-spacing:.05em; padding:8px 7px;
  }
  .overview-table tr.ov-zone-row:hover td{ background:var(--surface-hi); }

  .panel-card{ border-color:var(--teal-500); box-shadow:0 0 0 3px rgba(47,163,140,.14), var(--shadow-sm); }

  .batch-list{ display:flex; flex-direction:column; gap:2px; }
  .batch-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 2px; border-bottom:1px solid var(--line-soft);
  }
  .batch-row:last-child{ border-bottom:none; }
  .batch-row-title{ font-size:13px; color:var(--ink); font-weight:500; }
  .batch-row-meta{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
  .batch-row-actions{ display:flex; gap:10px; flex:none; }

  .loading{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 0; color:var(--ink-faint); font-size:13px; gap:14px; }
  .loading::before{
    content:''; width:26px; height:26px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--teal-500);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .app-version{ font-size:11px; color:var(--ink-faint); margin-top:10px; }

  .update-toast{
    position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); max-width:696px; margin:0 auto;
    background:linear-gradient(135deg, var(--teal-500), var(--teal-700)); color:#fff; padding:13px 15px; border-radius:var(--radius);
    box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px; font-size:13.5px; z-index:50;
    animation:toastIn .3s var(--ease);
  }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(12px);} to{ opacity:1; transform:translateY(0);} }
  .update-toast button{
    background:#fff; color:var(--teal-700); border:none; border-radius:var(--radius-sm); padding:9px 14px;
    font-weight:700; font-size:13px; cursor:pointer; flex:none;
  }

  @media (max-width:380px){ .field-row{ grid-template-columns:1fr; } }

  .login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background-image:radial-gradient(900px 500px at 50% 0%, rgba(47,163,140,.16), transparent 65%);
  }
  .login-card{
    width:100%; max-width:340px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:32px 26px; box-shadow:var(--shadow-lg); text-align:center; animation:viewIn .35s var(--ease);
  }
  .login-card .wave{
    width:52px; height:52px; margin:0 auto 14px auto; color:var(--heading);
    background:linear-gradient(135deg, var(--teal-500), var(--teal-700)); border-radius:16px; padding:12px;
    box-shadow:0 8px 20px rgba(47,163,140,.3);
  }
  .login-card h1{ font-size:20px; margin:0 0 5px 0; color:var(--heading); }
  .login-card p{ font-size:12.5px; color:var(--ink-soft); margin:0 0 20px 0; }
</style>
</head>

<div id="app"><div class="loading">กำลังโหลด…</div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* ============================================================
   SHRIMP FARM WEEKLY TRACKER
   Data lives in Firebase (Firestore) and syncs in real time
   across devices. Firestore's offline persistence keeps the app
   usable without a connection; writes made offline sync once
   back online. Signs in anonymously in the background (no password
   screen) purely so Firestore's security rules have a request.auth
   to check — this app has no access gate, anyone with the link can
   read/write the data.
   ============================================================ */

const firebaseConfig = {
  apiKey: "AIzaSyCvcR6a4LEKq-7TsSlrMYXP4bh3TwZY-NI",
  authDomain: "shrimp-farm-data.firebaseapp.com",
  projectId: "shrimp-farm-data",
  storageBucket: "shrimp-farm-data.firebasestorage.app",
  messagingSenderId: "105951477051",
  appId: "1:105951477051:web:de134a245b683625304b1e",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({ synchronizeTabs: true }).catch((e)=>console.warn('Firestore offline persistence unavailable', e));

const APP_VERSION = '__BUILD_VERSION__';

const SPECIES_OPTIONS = ['กุ้งขาว (Vannamei)','กุ้งกุลาดำ (Black Tiger)','อื่นๆ'];

let state = { farms: [], ponds: [], records: [], batches: [], harvests: [] };

let editingRecordId = null;

/* ---------------- Utilities ---------------- */
function fmtDate(iso){ if(!iso) return '-'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'2-digit'}); }
function daysBetween(a,b){ const d1=new Date(a+'T00:00:00'), d2=new Date(b+'T00:00:00'); return Math.round((d2-d1)/86400000); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function weightFromCount(count){ if(!count||count<=0) return null; return 1000/count; }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------------- Data layer (Firestore, real-time sync + offline cache) ---------------- */
let unsubFarms = null, unsubPonds = null, unsubRecords = null, unsubBatches = null, unsubHarvests = null;
let seededFarms = false;

async function ensureFarmsSeeded(){
  if(seededFarms) return;
  seededFarms = true;
  try{
    const snap = await Promise.race([
      db.collection('farms').limit(1).get(),
      new Promise((_, reject)=>setTimeout(()=>reject(new Error('timed out')), 10000)),
    ]);
    if(snap.empty){
      const batch = db.batch();
      FARM_SEED.forEach((name,i)=>{
        batch.set(db.collection('farms').doc('farm'+(i+1)), { name, order:i });
      });
      await batch.commit();
    }
  }catch(e){
    console.error('seed farms failed', e);
    seededFarms = false; // allow a retry on the next auth state change (e.g. reconnect)
  }
}

function attachFirestoreListeners(){
  unsubFarms = db.collection('farms').orderBy('order').onSnapshot((snap)=>{
    state.farms = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    render();
  }, (e)=>console.error('farms listener error', e));

  unsubPonds = db.collection('ponds').onSnapshot((snap)=>{
    state.ponds = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    render();
  }, (e)=>console.error('ponds listener error', e));

  unsubRecords = db.collection('records').onSnapshot((snap)=>{
    state.records = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    render();
  }, (e)=>console.error('records listener error', e));

  unsubBatches = db.collection('batches').onSnapshot((snap)=>{
    state.batches = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    render();
  }, (e)=>console.error('batches listener error', e));

  unsubHarvests = db.collection('harvests').onSnapshot((snap)=>{
    state.harvests = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    render();
  }, (e)=>console.error('harvests listener error', e));
}

function detachFirestoreListeners(){
  if(unsubFarms) unsubFarms();
  if(unsubPonds) unsubPonds();
  if(unsubRecords) unsubRecords();
  if(unsubBatches) unsubBatches();
  if(unsubHarvests) unsubHarvests();
  unsubFarms = unsubPonds = unsubRecords = unsubBatches = unsubHarvests = null;
  state = { farms: [], ponds: [], records: [], batches: [], harvests: [] };
  currentFarmId = 'overview';
  currentPondId = null;
}

function pondsForFarm(farmId){
  return state.ponds
    .filter(p=>p.farmId===farmId)
    .slice()
    .sort((a,b)=>(a.name||'').localeCompare(b.name||'', 'th', { numeric:true, sensitivity:'base' }));
}

/* ---------------- "Updated recently" badge (per-device, not synced) ---------------- */
const POND_VIEWED_KEY = 'shrimp-farm-pond-viewed';
const UPDATE_BADGE_MAX_AGE_MS = 2 * 24 * 60 * 60 * 1000; // 2 days

function pondLastActivityAt(pond){
  const recs = recordsForPond(pond.id);
  const recMax = recs.reduce((max,r)=> (r.updatedAt && r.updatedAt>max) ? r.updatedAt : max, 0);
  return Math.max(pond.updatedAt||0, recMax);
}
function getPondViewedMap(){
  try{ return JSON.parse(localStorage.getItem(POND_VIEWED_KEY) || '{}'); }
  catch(e){ return {}; }
}
function markPondViewed(pondId){
  try{
    const map = getPondViewedMap();
    map[pondId] = Date.now();
    localStorage.setItem(POND_VIEWED_KEY, JSON.stringify(map));
  }catch(e){}
}
function isPondRecentlyUpdated(pond){
  const lastActivity = pondLastActivityAt(pond);
  if(!lastActivity) return false;
  if(Date.now() - lastActivity > UPDATE_BADGE_MAX_AGE_MS) return false;
  const viewedAt = getPondViewedMap()[pond.id] || 0;
  return lastActivity > viewedAt;
}
function recordsForPond(pondId){
  return state.records.filter(r=>r.pondId===pondId).slice().sort((a,b)=>a.weekDate.localeCompare(b.weekDate));
}
function harvestsForPond(pondId){
  return state.harvests.filter(h=>h.pondId===pondId).slice().sort((a,b)=>(a.harvestDate||'').localeCompare(b.harvestDate||''));
}

/* ---------------- Pathogen results (written by the weekly culture-log app) ---------------- */
// Pathogen fields live directly on the pond doc (pathogenStatus/pathogenSeverity/
// pathogenWorsened/pathogenDate = latest result, pathogenHistory[] = every week's result)
// written by a separate lab-report import tool — not entered here, and never touching
// `records` (this app's own weekly growth/feed log).
const PATHOGEN_SEVERITY_LABEL = { critical:'วิกฤต', watch:'เฝ้าระวัง', normal:'ปกติ' };
const PATHOGEN_SEVERITY_CLASS = { critical:'coral', watch:'amber', normal:'good' };
function latestPathogenInfo(pond){
  if(!pond || !pond.pathogenSeverity) return null;
  return { weekDate:pond.pathogenDate, status:pond.pathogenStatus, severity:pond.pathogenSeverity, worsened:pond.pathogenWorsened };
}
function pathogenHistoryForPond(pond){
  return (pond && pond.pathogenHistory) ? pond.pathogenHistory.slice().sort((a,b)=>(a.weekDate||'').localeCompare(b.weekDate||'')) : [];
}
function pathogenChipHtml(severity, status){
  if(!severity) return '';
  const cls = PATHOGEN_SEVERITY_CLASS[severity] || '';
  const label = PATHOGEN_SEVERITY_LABEL[severity] || severity;
  return `<span class="pathogen-chip ${cls}" title="${escapeHtml(status||'')}">เชื้อ: ${escapeHtml(label)}</span>`;
}
function computeAdgForPond(p, recs){
  if(!recs || recs.length===0) return null;
  const last = recs[recs.length-1];
  const lastWeight = weightFromCount(last.sizeCount);
  if(lastWeight===null) return null;
  if(recs.length>=2){
    const prev = recs[recs.length-2];
    const dDays = daysBetween(prev.weekDate, last.weekDate);
    const wPrev = weightFromCount(prev.sizeCount);
    if(dDays>0 && wPrev!==null) return (lastWeight-wPrev)/dDays;
  }
  if(p.releaseDate){
    const doc = daysBetween(p.releaseDate, last.weekDate);
    if(doc>0) return lastWeight/doc;
  }
  return null;
}
function estimatedBiomassKg(releaseCount, survivalRate, sizeCount){
  if(!releaseCount || survivalRate==null || !sizeCount) return null;
  const weightG = weightFromCount(sizeCount);
  if(weightG===null) return null;
  const survivingCount = releaseCount * (survivalRate/100);
  return survivingCount * weightG / 1000;
}
function estimatedSurvivingCount(releaseCount, survivalRate){
  if(!releaseCount || survivalRate==null) return null;
  return Math.round(releaseCount * (survivalRate/100));
}

/* ---------------- Bootstrap ---------------- */
function boot(){
  auth.onAuthStateChanged((user)=>{
    authReady = true;
    if(user){
      attachFirestoreListeners();
      ensureFarmsSeeded(); // fire-and-forget: don't block the UI on a Firestore round-trip
    } else {
      detachFirestoreListeners();
    }
    render();
  });
  auth.signInAnonymously().catch((e)=>console.error('anonymous sign-in failed', e));
}

/* ---------------- Rendering ---------------- */
function render(){
  const app = document.getElementById('app');
  if(!authReady){
    app.innerHTML = `<div class="loading">กำลังโหลด…</div>`;
    return;
  }
  try{
    let html = `
      <div class="app-banner">ซิงก์ข้อมูลกับทีมแบบเรียลไทม์ · ใช้งานออฟไลน์ได้</div>
      <div class="topbar">
        <div class="wave">${ICONS.wave}</div>
        <div style="flex:1">
          <h1>บันทึกฟาร์มกุ้ง</h1>
          <div class="sub">ข้อมูลรายสัปดาห์ · ${state.farms.length} ฟาร์ม</div>
        </div>
        <button class="icon-btn" id="btn-settings" title="ตั้งค่า">${ICONS.gear}</button>
      </div>
    `;

    let panelHtml = '';
    if(showSettingsSheet) panelHtml += renderSettingsPanel();
    if(showPondFormSheet) panelHtml += renderPondFormPanel();
    if(panelHtml) html += `<div style="padding:14px 16px 0 16px">${panelHtml}</div>`;

    if(viewingHarvestPondId){
      html += renderHarvestForm();
    } else if(viewingBatchId){
      html += renderBatchDetail();
    } else if(currentPondId){
      html += renderPondDetail();
    } else {
      html += renderFarmDashboard();
    }

    app.innerHTML = html;
    bindDashboardEvents();

    if(viewingHarvestPondId){ /* no charts on the harvest page */ }
    else if(viewingBatchId) drawBatchCharts();
    else if(currentPondId) drawCharts();
  }catch(e){
    console.error('render() failed', e);
    app.innerHTML = `
      <div class="login-wrap">
        <div class="login-card">
          <h1>เกิดข้อผิดพลาด</h1>
          <p>ไม่สามารถแสดงผลข้อมูลได้ ลองโหลดหน้านี้ใหม่อีกครั้ง</p>
          <button class="btn btn-primary" type="button" onclick="location.reload()">โหลดหน้าใหม่</button>
        </div>
      </div>`;
  }
}

function renderFarmDashboard(){
  const tabs = `<button class="farm-tab ${currentFarmId==='overview'?'active':''}" data-farm="overview">ภาพรวม</button>` +
    state.farms.map(f => `
    <button class="farm-tab ${f.id===currentFarmId?'active':''}" data-farm="${f.id}">${escapeHtml(f.name)}</button>
  `).join('');

  if(currentFarmId === 'overview') return renderOverviewDashboard(tabs);

  const farm = state.farms.find(f=>f.id===currentFarmId);
  const ponds = pondsForFarm(currentFarmId);
  let pondsHtml = '';
  if(ponds.length === 0){
    pondsHtml = `
      <div class="empty-state">
        ${ICONS.shrimp}
        <p><b>ยังไม่มีบ่อในฟาร์มนี้</b></p>
        <p>กดปุ่ม "+ เพิ่มบ่อ" ด้านล่างเพื่อเริ่มบันทึกข้อมูล</p>
      </div>`;
  } else {
    pondsHtml = `<div class="pond-grid">` + ponds.map(p => renderPondCard(p)).join('') + `</div>`;
  }

  return `
    <div class="farm-tabs">${tabs}</div>
    <main>
      <div class="farm-title-row">
        <h2>${escapeHtml(farm ? farm.name : '')}</h2>
        <button data-rename-farm="${farm?farm.id:''}">แก้ชื่อฟาร์ม</button>
      </div>
      ${pondsHtml}
      <button class="fab" id="btn-add-pond">${ICONS.plus} เพิ่มบ่อใหม่</button>
    </main>
  `;
}

function renderOverviewDashboard(tabs){
  const groups = state.farms
    .map(farm => ({ farm, ponds: pondsForFarm(farm.id) }))
    .filter(g => g.ponds.length > 0);

  let bodyHtml;
  if(groups.length === 0){
    bodyHtml = `
      <div class="empty-state">
        ${ICONS.shrimp}
        <p><b>ยังไม่มีบ่อในระบบ</b></p>
        <p>เลือกฟาร์มด้านบนแล้วกด "+ เพิ่มบ่อ" เพื่อเริ่มบันทึกข้อมูล</p>
      </div>`;
  } else {
    const trs = groups.map(({farm, ponds})=>{
      const zoneRow = `
        <tr class="ov-zone-row"><td colspan="5">${escapeHtml(farm.name)} · ${ponds.length} บ่อ</td></tr>`;
      const pondRows = ponds.map(pond=>{
        const doc = pond.releaseDate ? daysBetween(pond.releaseDate, todayISO()) : null;
        const recs = recordsForPond(pond.id);
        const last = recs[recs.length-1];
        const adg = computeAdgForPond(pond, recs);
        const speciesShort = pond.species ? pond.species.split('(')[0].trim() : '';
        const isNew = isPondRecentlyUpdated(pond);
        return `
          <tr data-open-pond="${pond.id}">
            <td>
              <div class="ov-pond-name">${escapeHtml(pond.name)}${isNew ? ` <span class="ov-update-badge">อัปเดตใหม่</span>` : ''}</div>
              ${speciesShort ? `<div class="ov-pond-species">${escapeHtml(speciesShort)}</div>` : ''}
            </td>
            <td>${last && last.sizeCount!=null ? last.sizeCount+' ตัว/กก.' : '-'}</td>
            <td>${doc!==null ? doc+' วัน' : '-'}</td>
            <td class="ov-adg">${adg!==null ? adg.toFixed(2) : '-'}</td>
            <td>${pond.pathogenSeverity ? pathogenChipHtml(pond.pathogenSeverity, pond.pathogenStatus) : '-'}</td>
          </tr>`;
      }).join('');
      return zoneRow + pondRows;
    }).join('');
    bodyHtml = `
      <div class="card">
        <div style="overflow-x:auto">
          <table class="rec-table overview-table">
            <thead><tr><th>บ่อ</th><th>ไซส์ล่าสุด</th><th>DOC</th><th>ADG</th><th>ผลเชื้อ</th></tr></thead>
            <tbody>${trs}</tbody>
          </table>
        </div>
      </div>`;
  }

  return `
    <div class="farm-tabs">${tabs}</div>
    <main>
      <div class="farm-title-row">
        <h2>ภาพรวมทุกฟาร์ม</h2>
      </div>
      ${bodyHtml}
    </main>
  `;
}

function renderPondCard(p){
  const doc = p.releaseDate ? daysBetween(p.releaseDate, todayISO()) : null;
  const recs = recordsForPond(p.id);
  const last = recs[recs.length-1];
  const adg = computeAdgForPond(p, recs);
  return `
    <div class="pond-card" data-open-pond="${p.id}">
      <div class="pond-card-top">
        <div>
          <h3>${escapeHtml(p.name)}</h3>
          <div class="pond-meta">${escapeHtml(p.species||'ยังไม่ระบุชนิด')} ${p.brand ? '· '+escapeHtml(p.brand) : ''}</div>
          ${p.pathogenSeverity ? `<div style="margin-top:5px">${pathogenChipHtml(p.pathogenSeverity, p.pathogenStatus)}</div>` : ''}
        </div>
        ${doc!==null ? `<span class="doc-chip">DOC ${doc} วัน</span>` : ''}
      </div>
      <div class="stat-row">
        <div class="stat">
          <div class="label">ไซส์ล่าสุด</div>
          <div class="val">${last && last.sizeCount!=null ? last.sizeCount+' ตัว/กก.' : '-'}</div>
        </div>
        <div class="stat">
          <div class="label">ADG (ก./วัน)</div>
          <div class="val coral">${adg!==null ? adg.toFixed(2) : '-'}</div>
        </div>
      </div>
    </div>
  `;
}

function renderPondDetail(){
  const p = state.ponds.find(x=>x.id===currentPondId);
  if(!p){ currentPondId = null; return renderFarmDashboard(); }
  const records = recordsForPond(p.id);
  const pathogenRec = latestPathogenInfo(p);
  const pondBatches = state.batches
    .filter(b=>b.pondId===p.id)
    .slice()
    .sort((a,b)=>(b.savedAt||'').localeCompare(a.savedAt||''));
  const editingRecordThisRender = editingRecordId ? records.find(r=>r.id===editingRecordId) : null;
  const doc = p.releaseDate ? daysBetween(p.releaseDate, todayISO()) : null;
  const last = records[records.length-1];
  const lastWeight = last ? weightFromCount(last.sizeCount) : null;
  const cumAdg = (lastWeight && doc) ? (lastWeight/doc) : null;

  let weeklyAdg = null;
  if(records.length >= 2){
    const prev = records[records.length-2];
    const dDays = daysBetween(prev.weekDate, last.weekDate);
    const wPrev = weightFromCount(prev.sizeCount), wLast = weightFromCount(last.sizeCount);
    if(dDays>0 && wPrev!==null && wLast!==null) weeklyAdg = (wLast-wPrev)/dDays;
  }
  const pondHarvests = harvestsForPond(p.id);
  const totalHarvestedCount = pondHarvests.reduce((sum,h)=> sum + (h.caughtCount||0), 0);
  const totalHarvestedKg = pondHarvests.reduce((sum,h)=> sum + (h.weightKg||0), 0);
  const totalHarvestedRevenue = pondHarvests.reduce((sum,h)=> sum + (h.revenue||0), 0);
  const rawSurvivingCount = last ? estimatedSurvivingCount(p.releaseCount, last.survivalRate) : null;
  const estimatedSurviving = rawSurvivingCount!==null ? Math.max(0, rawSurvivingCount - totalHarvestedCount) : null;
  const estimatedYieldKg = (()=>{
    if(estimatedSurviving===null || !last || !last.sizeCount) return null;
    const weightG = weightFromCount(last.sizeCount);
    if(weightG===null) return null;
    return estimatedSurviving * weightG / 1000;
  })();

  const rows = records.slice().reverse().map(r=>{
    const w = weightFromCount(r.sizeCount);
    const recDoc = p.releaseDate ? daysBetween(p.releaseDate, r.weekDate) : null;
    return `
      <tr>
        <td>${fmtDate(r.weekDate)}</td>
        <td>${recDoc!==null ? recDoc+' วัน' : '-'}</td>
        <td>${r.sizeCount!=null ? r.sizeCount+' ตัว/กก.<br><span style="color:var(--ink-faint);font-size:11px">'+(w?w.toFixed(1)+' ก.':'')+'</span>' : '-'}</td>
        <td>${r.feedPerDay!=null ? r.feedPerDay+' กก.' : '-'}</td>
        <td>${r.survivalRate!=null ? r.survivalRate+'%' : '-'}</td>
        <td>${r.note ? escapeHtml(r.note) : '-'}</td>
        <td><button class="row-del" data-edit-record="${r.id}" style="color:var(--teal-500)">แก้ไข</button> <button class="row-del" data-del-record="${r.id}">ลบ</button></td>
      </tr>`;
  }).join('');

  const pathogenHistoryCount = pathogenHistoryForPond(p).length;
  const pathogenDaysAgo = (pathogenRec && pathogenRec.weekDate) ? daysBetween(pathogenRec.weekDate, todayISO()) : null;
  const pathogenLatestHtml = pathogenRec ? `
    <div class="card">
      <h3>ผลตรวจเชื้อล่าสุด</h3>
      <div class="pathogen-list">
        <div class="pathogen-entry ${PATHOGEN_SEVERITY_CLASS[pathogenRec.severity]||''}">
          <div class="pe-head">
            <span class="pe-date">${fmtDate(pathogenRec.weekDate)}${pathogenDaysAgo!==null ? ` · ${pathogenDaysAgo<=0?'วันนี้':pathogenDaysAgo+' วันที่แล้ว'}` : ''}</span>
            ${pathogenChipHtml(pathogenRec.severity, pathogenRec.status)}
            ${pathogenRec.worsened ? `<span class="pe-worse">▲ แย่ลงจากรอบก่อน</span>` : ''}
          </div>
          <div class="pe-text">${escapeHtml(pathogenRec.status||'-')}</div>

function renderHarvestForm(){
  const p = state.ponds.find(x=>x.id===viewingHarvestPondId);
  if(!p){ viewingHarvestPondId = null; return renderPondDetail(); }
  const records = recordsForPond(p.id);
  const last = records[records.length-1];
  const pondHarvests = harvestsForPond(p.id);
  const totalHarvestedKg = pondHarvests.reduce((sum,h)=> sum + (h.weightKg||0), 0);
  const totalHarvestedRevenue = pondHarvests.reduce((sum,h)=> sum + (h.revenue||0), 0);
  const rawSurvivingCount = last ? estimatedSurvivingCount(p.releaseCount, last.survivalRate) : null;
  const totalHarvestedCount = pondHarvests.reduce((sum,h)=> sum + (h.caughtCount||0), 0);
  const currentRemaining = rawSurvivingCount!==null ? Math.max(0, rawSurvivingCount - totalHarvestedCount) : null;
  const currentSurvivalRatePct = (currentRemaining!==null && p.releaseCount) ? (currentRemaining / p.releaseCount * 100) : null;

  const rows = pondHarvests.slice().reverse().map(h=>`
    <tr>
      <td>${fmtDate(h.harvestDate)}</td>
      <td>${h.weightKg!=null ? h.weightKg.toLocaleString('th-TH')+' กก.' : '-'}</td>
      <td>${h.sizeCount!=null ? h.sizeCount+' ตัว/กก.' : '-'}</td>
      <td>${h.pricePerKg!=null ? h.pricePerKg.toLocaleString('th-TH')+' บ./กก.' : '-'}</td>
      <td>${h.revenue!=null ? h.revenue.toLocaleString('th-TH',{maximumFractionDigits:0})+' บ.' : '-'}</td>
      <td>${h.caughtCount!=null ? h.caughtCount.toLocaleString('th-TH')+' ตัว' : '-'}</td>
      <td>${h.remainingAfter!=null ? h.remainingAfter.toLocaleString('th-TH')+' ตัว' : '-'}${h.survivalRateAfter!=null ? '<br><span style="color:var(--ink-faint);font-size:11px">'+h.survivalRateAfter.toFixed(1)+'%</span>' : ''}</td>
      <td><button class="row-del" data-del-harvest="${h.id}">ลบ</button></td>
    </tr>`).join('');

  return `
    <div class="harvest-page">
    <div class="backbar">
      <button class="back-btn" id="btn-back-harvest">${ICONS.back} กลับ</button>
    </div>
    <main>
      <div class="pond-head">
        <h2>แบ่งจับ — ${escapeHtml(p.name)}</h2>
      </div>

      <div class="summary-strip">
        <div class="summary-box">
          <div class="n">${currentRemaining!==null ? currentRemaining.toLocaleString('th-TH') : '-'}</div>
          <div class="l">ตัว เหลือตอนนี้</div>
        </div>
        <div class="summary-box amber">
          <div class="n">${currentSurvivalRatePct!==null ? currentSurvivalRatePct.toFixed(1)+'%' : '-'}</div>
          <div class="l">อัตรารอดปัจจุบัน</div>
        </div>
        <div class="summary-box coral">
          <div class="n">${totalHarvestedKg.toLocaleString('th-TH',{maximumFractionDigits:1})}</div>
          <div class="l">กก. จับสะสม</div>
        </div>
      </div>

      <div class="card" id="harvest-form-card">
        <h3>บันทึกการแบ่งจับ</h3>
        <form id="harvest-form">
          <div class="field-row">
            <div class="field">
              <label>วันที่จับ</label>
              <input type="date" name="harvestDate" id="harvest-date" value="${todayISO()}" required>
            </div>
            <div class="field">
              <label>ไซส์ที่จับ (ตัว/กก.)</label>
              <input type="number" inputmode="decimal" step="0.1" name="sizeCount" id="harvest-size" placeholder="เช่น 60" required>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>น้ำหนักที่จับ (กก.)</label>
              <input type="number" inputmode="decimal" step="0.1" name="weightKg" id="harvest-weight" placeholder="เช่น 500" required>
            </div>
            <div class="field">
              <label>ราคา (บาท/กก.) (ถ้ามี)</label>
              <input type="number" inputmode="decimal" step="0.1" name="pricePerKg" id="harvest-price" placeholder="เช่น 120">
            </div>
          </div>
          <div class="field">
            <label>หมายเหตุ (ถ้ามี)</label>
            <input type="text" name="note" placeholder="เช่น จับหน้าฝน, ลูกค้า A">
          </div>
          <div style="background:var(--surface-hi);border-radius:10px;padding:12px 14px;margin-bottom:13px;text-align:center;">
            <div style="font-size:11px;color:var(--ink-faint);">หลังแบ่งจับนี้ คาดว่าจะเหลือ</div>
            <div id="harvest-preview-remaining" style="font-size:20px;font-weight:700;color:var(--heading);font-family:'Taviraj',serif;margin-top:3px;">-</div>
            <div id="harvest-preview-caption" style="font-size:11px;color:var(--ink-faint);margin-top:2px;">ใส่น้ำหนักและไซส์ที่จับเพื่อคำนวณ</div>
          </div>
          <div class="btn-row">
            <button class="btn btn-primary" type="submit" style="flex:1">บันทึกการแบ่งจับ</button>
          </div>

      ${pondHarvests.length>0 ? `
      <div class="card">
        <h3>ประวัติการแบ่งจับ${totalHarvestedRevenue>0 ? ` · รวม ${totalHarvestedRevenue.toLocaleString('th-TH',{maximumFractionDigits:0})} บาท` : ''}</h3>
        <div style="overflow-x:auto">
          <table class="rec-table">
            <thead><tr><th>วันที่</th><th>น้ำหนัก</th><th>ไซส์</th><th>ราคา</th><th>มูลค่า</th><th>จับได้</th><th>เหลือหลังจับ</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>` : `<div class="empty-state">${ICONS.shrimp}<p>ยังไม่มีประวัติการแบ่งจับ</p></div>`}
    </main>
    </div>
  `;
}

function renderBatchDetail(){
  const batch = state.batches.find(b=>b.id===viewingBatchId);
  if(!batch){ viewingBatchId = null; return renderPondDetail(); }
  const records = (batch.records || []).slice().sort((a,b)=>a.weekDate.localeCompare(b.weekDate));
  const last = records[records.length-1];
  const lastWeight = last ? weightFromCount(last.sizeCount) : null;
  const doc = (batch.releaseDate && last) ? daysBetween(batch.releaseDate, last.weekDate) : null;
  const cumAdg = (lastWeight && doc) ? (lastWeight/doc) : null;

  let weeklyAdg = null;
  if(records.length >= 2){
    const prev = records[records.length-2];
    const dDays = daysBetween(prev.weekDate, last.weekDate);
    const wPrev = weightFromCount(prev.sizeCount), wLast = weightFromCount(last.sizeCount);
    if(dDays>0 && wPrev!==null && wLast!==null) weeklyAdg = (wLast-wPrev)/dDays;
  }
  const estimatedYieldKg = last ? estimatedBiomassKg(batch.releaseCount, last.survivalRate, last.sizeCount) : null;

  const rows = records.slice().reverse().map(r=>{
    const w = weightFromCount(r.sizeCount);
    const recDoc = batch.releaseDate ? daysBetween(batch.releaseDate, r.weekDate) : null;
    return `
      <tr>
        <td>${fmtDate(r.weekDate)}</td>
        <td>${recDoc!==null ? recDoc+' วัน' : '-'}</td>
        <td>${r.sizeCount!=null ? r.sizeCount+' ตัว/กก.<br><span style="color:var(--ink-faint);font-size:11px">'+(w?w.toFixed(1)+' ก.':'')+'</span>' : '-'}</td>
        <td>${r.feedPerDay!=null ? r.feedPerDay+' กก.' : '-'}</td>
        <td>${r.survivalRate!=null ? r.survivalRate+'%' : '-'}</td>
        <td>${r.note ? escapeHtml(r.note) : '-'}</td>
      </tr>`;
  }).join('');

  const batchPathogenEntries = (batch.pathogenHistory || []).slice().sort((a,b)=>(a.weekDate||'').localeCompare(b.weekDate||'')).reverse();
  const batchPathogenHistoryHtml = batchPathogenEntries.length ? `
    <div class="card">
      <h3>ผลตรวจเชื้อรายสัปดาห์</h3>
      <div class="pathogen-list">
        ${batchPathogenEntries.map(r=>`
          <div class="pathogen-entry ${PATHOGEN_SEVERITY_CLASS[r.severity]||''}">
            <div class="pe-head">
              <span class="pe-date">${fmtDate(r.weekDate)}</span>
              ${pathogenChipHtml(r.severity, r.status)}
              ${r.worsened ? `<span class="pe-worse">▲ แย่ลงจากรอบก่อน</span>` : ''}
            </div>
            <div class="pe-text">${escapeHtml(r.status||'-')}</div>
          </div>
        `).join('')}
      </div>
    </div>` : '';

  return `
    <div class="backbar">
      <button class="back-btn" id="btn-back-batch">${ICONS.back} กลับ</button>
    </div>
    <main>
      <div class="pond-head">
        <h2>${escapeHtml(batch.pondName||'บ่อ')} <span style="font-size:13px;color:var(--ink-faint);font-weight:500">(ประวัติ)</span></h2>
        <div class="tag-row">
          <span class="tag">${escapeHtml(batch.species||'ยังไม่ระบุชนิด')}</span>
          ${batch.brand ? `<span class="tag">แบรนด์: ${escapeHtml(batch.brand)}</span>` : ''}
          ${batch.releaseDate ? `<span class="tag coral">ปล่อย ${fmtDate(batch.releaseDate)}</span>` : ''}
          ${batch.releaseCount ? `<span class="tag">จำนวนปล่อย ${Number(batch.releaseCount).toLocaleString('th-TH')} ตัว</span>` : ''}
          <span class="tag amber">บันทึกเมื่อ ${fmtDate(batch.savedAt)}</span>
        </div>
      </div>

      <div class="summary-strip">
        <div class="summary-box">
          <div class="n">${last && last.sizeCount!=null ? last.sizeCount : '-'}</div>
          <div class="l">ตัว/กก. ล่าสุด</div>
        </div>
        <div class="summary-box amber">
          <div class="n">${last && last.feedPerDay!=null ? last.feedPerDay : '-'}</div>
          <div class="l">กก. อาหาร/วัน</div>
        </div>
        <div class="summary-box coral">
          <div class="n">${weeklyAdg!==null ? weeklyAdg.toFixed(2) : (cumAdg!==null?cumAdg.toFixed(2):'-')}</div>
          <div class="l">ADG (ก./วัน)</div>
        </div>
      </div>

      <div class="card" style="text-align:center; padding:14px 16px;">
        <div style="font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600;">ผลผลิตโดยประมาณ</div>
        <div style="font-size:24px;font-weight:700;color:var(--heading);font-family:'Taviraj',serif;margin-top:4px;">${estimatedYieldKg!==null ? estimatedYieldKg.toLocaleString('th-TH',{maximumFractionDigits:1})+' กก.' : '-'}</div>

      </div>

      ${records.length>0 ? `
      <div class="card">
        <h3>แนวโน้มไซส์กุ้ง (น้ำหนักเฉลี่ย กรัม)</h3>
        <div class="chart-wrap" id="chart-size"></div>
      </div>
      <div class="card">
        <h3>แนวโน้มอาหารต่อวัน (กก.)</h3>

      ${records.length>=2 ? `

/* ---------------- Charts ---------------- */
function svgLineChart({labels, values, color, fillColor}){
  const width = 600, height = 180;
  const padL = 40, padR = 12, padT = 12, padB = 26;
  const innerW = width - padL - padR;
  const innerH = height - padT - padB;

  const valid = values.map((v,i)=>({v,i})).filter(d=>d.v!==null && d.v!==undefined && !isNaN(d.v));
  if(valid.length===0){
    return `<div style="display:flex;align-items:center;justify-content:center;height:${height}px;color:var(--ink-faint);font-size:12.5px">ยังไม่มีข้อมูลเพียงพอ</div>`;
  }

  let min = Math.min(...valid.map(d=>d.v));
  let max = Math.max(...valid.map(d=>d.v));
  if(min === max){ const bump = Math.abs(min)*0.1 || 1; min -= bump; max += bump; }
  const rangePad = (max-min)*0.15;
  min -= rangePad; max += rangePad;
  if(min < 0 && valid.every(d=>d.v>=0)) min = 0;

  const n = labels.length;
  const xFor = i => n<=1 ? padL+innerW/2 : padL + (innerW * i/(n-1));
  const yFor = v => padT + innerH * (1 - (v-min)/(max-min));

  let gridLines = '';
  const gridCount = 4;
  for(let g=0; g<=gridCount; g++){
    const gv = min + (max-min)*g/gridCount;
    const gy = yFor(gv);
    gridLines += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${width-padR}" y2="${gy.toFixed(1)}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
    gridLines += `<text x="${padL-8}" y="${(gy+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#6E8880">${gv.toFixed(Math.abs(gv)<10?1:0)}</text>`;
  }

  let pathSegments = [], currentSeg = [];
  values.forEach((v,i)=>{
    if(v===null || v===undefined || isNaN(v)){
      if(currentSeg.length) pathSegments.push(currentSeg);
      currentSeg = [];
    } else {
      currentSeg.push([xFor(i), yFor(v)]);
    }
  });
  if(currentSeg.length) pathSegments.push(currentSeg);

  const pointRadius = valid.length<=2 ? 5.5 : 3.5;
  let linesHtml = '', areaHtml = '';
  pathSegments.forEach(seg=>{
    if(seg.length>=2){
      const d = seg.map((p,idx)=> (idx===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
      linesHtml += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
      const areaD = d + ` L${seg[seg.length-1][0].toFixed(1)},${(padT+innerH).toFixed(1)} L${seg[0][0].toFixed(1)},${(padT+innerH).toFixed(1)} Z`;
      areaHtml += `<path d="${areaD}" fill="${fillColor}" stroke="none"/>`;
    }
  });

  let pointsHtml = '';
  valid.forEach(d=>{
    const x = xFor(d.i), y = yFor(d.v);
    pointsHtml += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${pointRadius}" fill="${color}" stroke="#0C1917" stroke-width="1.5"/>`;
  });

  let xLabelsHtml = '';
  const maxLabels = 4;
  const step = Math.max(1, Math.ceil(n/maxLabels));
  labels.forEach((lab,i)=>{
    if(i%step===0 || i===n-1){
      const shortLab = lab.split('(')[0].trim();
      xLabelsHtml += `<text x="${xFor(i).toFixed(1)}" y="${height-6}" text-anchor="middle" font-size="10" fill="#6E8880">${escapeHtml(shortLab)}</text>`;
    }
  });

  return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="width:100%;height:${height}px;display:block">
    ${gridLines}${areaHtml}${linesHtml}${pointsHtml}${xLabelsHtml}
  </svg>`;
}

function drawChartsFor(records, releaseDate){
  if(records.length===0) return;
  const labels = records.map(r=>{
    const d = releaseDate ? daysBetween(releaseDate, r.weekDate) : null;
    return d!==null ? `${fmtDate(r.weekDate)} (DOC ${d})` : fmtDate(r.weekDate);
  });

  const sizeEl = document.getElementById('chart-size');
  if(sizeEl){
    const values = records.map(r=>{ const w=weightFromCount(r.sizeCount); return w? +w.toFixed(2):null; });
    sizeEl.innerHTML = svgLineChart({labels, values, color:'#2FA38C', fillColor:'rgba(47,163,140,.18)'});
  }

  const feedEl = document.getElementById('chart-feed');
  if(feedEl){
    const values = records.map(r=>r.feedPerDay);
    feedEl.innerHTML = svgLineChart({labels, values, color:'#EFB753', fillColor:'rgba(239,183,83,.18)'});
  }

  const adgEl = document.getElementById('chart-adg');
  if(adgEl && records.length>=2){
    const adgData = [null];
    for(let i=1;i<records.length;i++){
      const d = daysBetween(records[i-1].weekDate, records[i].weekDate);
      const w0 = weightFromCount(records[i-1].sizeCount), w1 = weightFromCount(records[i].sizeCount);
      adgData.push((d>0 && w0!==null && w1!==null) ? +(((w1-w0)/d)).toFixed(3) : null);
    }
    adgEl.innerHTML = svgLineChart({labels, values: adgData, color:'#E8815F', fillColor:'rgba(232,129,95,.18)'});
  }
}

function drawCharts(){
  const records = recordsForPond(currentPondId);
  const pondForChart = state.ponds.find(x=>x.id===currentPondId);
  drawChartsFor(records, pondForChart && pondForChart.releaseDate);
}

function drawBatchCharts(){
  const batch = state.batches.find(b=>b.id===viewingBatchId);
  if(!batch) return;
  drawChartsFor(batch.records || [], batch.releaseDate);
}

  document.querySelectorAll('[data-open-pond]').forEach(card=>{
    card.onclick = ()=>{
      currentPondId = card.getAttribute('data-open-pond');
      editingRecordId = null;
      viewingHarvestPondId = null;
      markPondViewed(currentPondId);
      render();
    };
  });

  const btnBack = document.getElementById('btn-back');
  if(btnBack) btnBack.onclick = ()=>{ currentPondId=null; editingRecordId=null; viewingHarvestPondId=null; render(); };

  const btnEditPond = document.getElementById('btn-edit-pond');
  if(btnEditPond) btnEditPond.onclick = ()=>{
    editingPond = state.ponds.find(p=>p.id===currentPondId);
    showPondFormSheet = true;
    render();
  };

  const btnDeletePond = document.getElementById('btn-delete-pond');
  if(btnDeletePond) btnDeletePond.onclick = async ()=>{
    if(!confirm('ลบบ่อนี้และประวัติการบันทึกทั้งหมด? การกระทำนี้ไม่สามารถย้อนกลับได้')) return;

    const writeBatch = db.batch();
    state.records.filter(r=>r.pondId===pondId).forEach(r=>writeBatch.delete(db.collection('records').doc(r.id)));
    state.harvests.filter(h=>h.pondId===pondId).forEach(h=>writeBatch.delete(db.collection('harvests').doc(h.id)));
    writeBatch.delete(db.collection('ponds').doc(pondId));

  const btnArchiveBatch = document.getElementById('btn-archive-batch');

    const pondId = currentPondId;

    if(!pond) return;
    const pondRecords = recordsForPond(pondId);
    if(pondRecords.length===0) return;
    if(!confirm(`บันทึกข้อมูล ${pondRecords.length} รายการของบ่อนี้เก็บไว้เป็นประวัติ แล้วล้างเพื่อเริ่มบันทึกรุ่นใหม่? การกระทำนี้ไม่สามารถย้อนกลับได้`)) return;
    const archivedRecords = pondRecords.map(r=>({
      weekDate:r.weekDate, sizeCount:r.sizeCount, feedPerDay:r.feedPerDay,
      survivalRate:r.survivalRate!=null?r.survivalRate:null, note:r.note||'',
    }));
    const pondHarvests = harvestsForPond(pondId);
    const archivedHarvests = pondHarvests.map(h=>({
      harvestDate:h.harvestDate, weightKg:h.weightKg, sizeCount:h.sizeCount,
      pricePerKg:h.pricePerKg!=null?h.pricePerKg:null, revenue:h.revenue!=null?h.revenue:null,
      caughtCount:h.caughtCount!=null?h.caughtCount:null, note:h.note||'',
    }));
    try{
      await db.collection('batches').add({
        pondId, pondName: pond.name, farmId: pond.farmId,
        species: pond.species||'', brand: pond.brand||'',
        releaseCount: pond.releaseCount||null, releaseDate: pond.releaseDate||'',
        savedAt: todayISO(),
        records: archivedRecords,
        pathogenHistory: pond.pathogenHistory || [],
        harvests: archivedHarvests,
      });
      const writeBatch = db.batch();
      pondRecords.forEach(r=>writeBatch.delete(db.collection('records').doc(r.id)));
      pondHarvests.forEach(h=>writeBatch.delete(db.collection('harvests').doc(h.id)));
      writeBatch.update(db.collection('ponds').doc(pondId), {
        pathogenHistory: [],
        pathogenStatus: firebase.firestore.FieldValue.delete(),
        pathogenSeverity: firebase.firestore.FieldValue.delete(),
        pathogenWorsened: firebase.firestore.FieldValue.delete(),
        pathogenDate: firebase.firestore.FieldValue.delete(),
        pathogenReportId: firebase.firestore.FieldValue.delete(),
      });
      await writeBatch.commit();
    }catch(e){ alert('บันทึกไม่สำเร็จ: '+e.message); }
    render();
  };

  const btnOpenHarvest = document.getElementById('btn-open-harvest');
  if(btnOpenHarvest) btnOpenHarvest.onclick = ()=>{ viewingHarvestPondId = currentPondId; render(); };

  const btnBackHarvest = document.getElementById('btn-back-harvest');
  if(btnBackHarvest) btnBackHarvest.onclick = ()=>{ viewingHarvestPondId = null; render(); };

      await db.collection('harvests').doc(id).delete()
        .catch((e)=>alert('ลบไม่สำเร็จ: '+e.message));
      render();
    };
  });

  const harvestForm = document.getElementById('harvest-form');
  if(harvestForm){
    const hWeightInput = harvestForm.querySelector('input[name=weightKg]');
    const hSizeInput = harvestForm.querySelector('input[name=sizeCount]');
    const hPreviewRemaining = document.getElementById('harvest-preview-remaining');
    const hPreviewCaption = document.getElementById('harvest-preview-caption');
    if(hWeightInput && hSizeInput && hPreviewRemaining && hPreviewCaption){
      const updateHarvestPreview = ()=>{
        const pond = state.ponds.find(x=>x.id===viewingHarvestPondId);
        if(!pond) return;
        const records = recordsForPond(pond.id);
        const last = records[records.length-1];
        const pondHarvests = harvestsForPond(pond.id);
        const totalHarvestedCount = pondHarvests.reduce((sum,h)=> sum + (h.caughtCount||0), 0);
        const rawSurvivingCount = last ? estimatedSurvivingCount(pond.releaseCount, last.survivalRate) : null;
        const currentRemaining = rawSurvivingCount!==null ? Math.max(0, rawSurvivingCount - totalHarvestedCount) : null;
        const weightKg = hWeightInput.value ? parseFloat(hWeightInput.value) : null;
        const sizeCount = hSizeInput.value ? parseFloat(hSizeInput.value) : null;
        if(currentRemaining!==null && weightKg && sizeCount){
          const caughtCount = weightKg * sizeCount;
          const remainingAfter = Math.max(0, currentRemaining - caughtCount);
          const survivalRateAfter = pond.releaseCount ? (remainingAfter / pond.releaseCount * 100) : null;
          hPreviewRemaining.textContent = remainingAfter.toLocaleString('th-TH',{maximumFractionDigits:0}) + ' ตัว';
          hPreviewCaption.textContent = `จับได้ประมาณ ${caughtCount.toLocaleString('th-TH',{maximumFractionDigits:0})} ตัว${survivalRateAfter!==null ? ` · อัตรารอดเหลือ ${survivalRateAfter.toFixed(1)}%` : ''}`;
        } else {

          hPreviewCaption.textContent = 'ใส่น้ำหนักและไซส์ที่จับเพื่อคำนวณ';
        }
      };
      hWeightInput.addEventListener('input', updateHarvestPreview);
      hSizeInput.addEventListener('input', updateHarvestPreview);
    }
    harvestForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const pond = state.ponds.find(x=>x.id===viewingHarvestPondId);
      if(!pond) return;
      const fd = new FormData(harvestForm);
      const harvestDate = fd.get('harvestDate');
      const weightKg = parseFloat(fd.get('weightKg'));
      const sizeCount = parseFloat(fd.get('sizeCount'));
      const pricePerKg = fd.get('pricePerKg') ? parseFloat(fd.get('pricePerKg')) : null;
      const note = (fd.get('note')||'').trim();

      const records = recordsForPond(pond.id);
      const last = records[records.length-1];
      const pondHarvests = harvestsForPond(pond.id);
      const totalHarvestedCount = pondHarvests.reduce((sum,h)=> sum + (h.caughtCount||0), 0);
      const rawSurvivingCount = last ? estimatedSurvivingCount(pond.releaseCount, last.survivalRate) : null;
      const currentRemaining = rawSurvivingCount!==null ? Math.max(0, rawSurvivingCount - totalHarvestedCount) : null;

      const caughtCount = weightKg * sizeCount;
      const remainingAfter = currentRemaining!==null ? Math.max(0, currentRemaining - caughtCount) : null;
      const survivalRateAfter = (remainingAfter!==null && pond.releaseCount) ? (remainingAfter / pond.releaseCount * 100) : null;
      const revenue = pricePerKg!=null ? weightKg * pricePerKg : null;

      const data = {
        pondId: pond.id, harvestDate, weightKg, sizeCount,
        pricePerKg, revenue, caughtCount, remainingAfter, survivalRateAfter,
        note, createdAt: Date.now(),
      };
      await db.collection('harvests').add(data).catch((e)=>alert('บันทึกไม่สำเร็จ: '+e.message));
      render();

    btn.onclick = async ()=>{

  const btnCancelEditRecord = document.getElementById('btn-cancel-edit-record');
  if(btnCancelEditRecord) btnCancelEditRecord.onclick = ()=>{ editingRecordId=null; render(); };

  document.querySelectorAll('[data-del-record]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('ลบข้อมูลบันทึกนี้?')) return;
      const id = btn.getAttribute('data-del-record');
      if(editingRecordId === id) editingRecordId = null;
      await db.collection('records').doc(id).delete()
        .catch((e)=>alert('ลบไม่สำเร็จ: '+e.message));
      render();
    };
  });

  const recordForm = document.getElementById('record-form');
  if(recordForm){
    const dateInput = document.getElementById('record-week-date');
    const docHint = document.getElementById('record-doc-hint');
    if(dateInput && docHint){
      dateInput.addEventListener('input', ()=>{
        const pond = state.ponds.find(x=>x.id===currentPondId);
        if(pond && pond.releaseDate && dateInput.value){
          docHint.textContent = 'อายุกุ้ง ณ วันที่บันทึก: ' + daysBetween(pond.releaseDate, dateInput.value) + ' วัน';
        }
      });
    }

    const sizeCountInput = recordForm.querySelector('input[name=sizeCount]');
    const survivalRateInput = recordForm.querySelector('input[name=survivalRate]');
    const yieldValueEl = document.getElementById('yield-value');
    const yieldCaptionEl = document.getElementById('yield-caption');
    const survivalCountEl = document.getElementById('survival-count-value');
    if(sizeCountInput && survivalRateInput && yieldValueEl && yieldCaptionEl){
      const updateYieldPreview = ()=>{
        const pond = state.ponds.find(x=>x.id===currentPondId);
        const sizeCount = sizeCountInput.value ? parseFloat(sizeCountInput.value) : null;
        const survivalRate = survivalRateInput.value ? parseFloat(survivalRateInput.value) : null;
        const totalHarvestedCount = pond ? harvestsForPond(pond.id).reduce((sum,h)=> sum + (h.caughtCount||0), 0) : 0;
        const rawSurvivingCount = pond ? estimatedSurvivingCount(pond.releaseCount, survivalRate) : null;
        const survivingCount = rawSurvivingCount!==null ? Math.max(0, rawSurvivingCount - totalHarvestedCount) : null;
        const weightG = sizeCount ? weightFromCount(sizeCount) : null;
        const kg = (survivingCount!==null && weightG!==null) ? survivingCount * weightG / 1000 : null;
        if(kg!==null){
          yieldValueEl.textContent = kg.toLocaleString('th-TH',{maximumFractionDigits:1}) + ' กก.';
          yieldCaptionEl.textContent = totalHarvestedCount>0 ? `อัตรารอด ${survivalRate}% − แบ่งจับสะสม ${totalHarvestedCount.toLocaleString('th-TH')} ตัว` : `คำนวณจากจำนวนปล่อย × อัตรารอด ${survivalRate}% × ไซส์ที่กรอก`;
        } else {
          yieldValueEl.textContent = '-';
          yieldCaptionEl.textContent = 'ใส่อัตรารอดด้านล่างเพื่อคำนวณผลผลิตโดยประมาณ';
        }
        if(survivalCountEl){
          survivalCountEl.textContent = survivingCount!==null ? survivingCount.toLocaleString('th-TH')+' ตัว' : '-';
        }
      };
      sizeCountInput.addEventListener('input', updateYieldPreview);
      survivalRateInput.addEventListener('input', updateYieldPreview);
    }
    recordForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(recordForm);
      const weekDate = fd.get('weekDate');
      const data = {
        pondId: currentPondId,
        weekDate,
        sizeCount: fd.get('sizeCount') ? parseFloat(fd.get('sizeCount')) : null,
        feedPerDay: parseFloat(fd.get('feedPerDay')),
        survivalRate: fd.get('survivalRate') ? parseFloat(fd.get('survivalRate')) : null,
        note: (fd.get('note')||'').trim(),
        updatedAt: Date.now(),
      };
      // avoid two records sharing the same date for this pond
      const conflict = state.records.find(r=>r.pondId===currentPondId && r.weekDate===weekDate && r.id!==editingRecordId);
      const batch = db.batch();
      if(conflict) batch.delete(db.collection('records').doc(conflict.id));

      if(editingRecordId){
        batch.set(db.collection('records').doc(editingRecordId), data);
        editingRecordId = null;
      } else {
        batch.set(db.collection('records').doc(), data);
      }
      await batch.commit().catch((e)=>alert('บันทึกไม่สำเร็จ: '+e.message));
      render();
    });
  }
}

/* ---------------- Go ---------------- */
boot();
</script>

<script>
/* ---------------- PWA: service worker registration + auto-update ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    const hadController = !!navigator.serviceWorker.controller;
    // Stamp the registration URL with the build version. Some browsers are
    // unreliable about byte-comparing a static './sw.js' URL to notice an
    // update (can silently keep an old worker in control indefinitely,
    // even with skipWaiting/clients.claim on the new one). Changing the
    // URL itself forces a real install check every deploy instead of
    // depending on that comparison.
    navigator.serviceWorker.register('./sw.js?v=' + encodeURIComponent(APP_VERSION)).then((reg)=>{
      reg.update();
      setInterval(()=>reg.update(), 30*60*1000);
      document.addEventListener('visibilitychange', ()=>{
        if(document.visibilityState === 'visible') reg.update();
      });
      reg.addEventListener('updatefound', ()=>{
        const newWorker = reg.installing;
        if(!newWorker) return;
        newWorker.addEventListener('statechange', ()=>{
          if(newWorker.state === 'activated' && hadController){
            showUpdateToast();
          }
        });
      });
    }).catch((e)=>console.warn('Service worker registration failed', e));
  });
}

function showUpdateToast(){
  if(document.getElementById('update-toast')) return;
  const toast = document.createElement('div');
  toast.id = 'update-toast';
  toast.className = 'update-toast';
  toast.innerHTML = `<span style="flex:1">มีอัปเดตเวอร์ชันใหม่ของแอป</span><button id="update-toast-btn">โหลดใหม่</button>`;
  document.body.appendChild(toast);
  document.getElementById('update-toast-btn').onclick = ()=>location.reload();
}
</script>
