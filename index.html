<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>บันทึกสุ่มกุ้งอนันต์ฟาร์ม</title>
<meta name="description" content="แอปบันทึกข้อมูลฟาร์มกุ้งรายสัปดาห์ ติดตามไซส์กุ้ง อาหาร และ ADG ใช้งานได้แบบออฟไลน์">
<meta name="theme-color" content="#1C6FA6">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="อนันต์ฟาร์ม">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#081824;
    --bg-grad:radial-gradient(1200px 600px at 50% -10%, rgba(46,147,203,.14), transparent 60%);
    --surface:#102436;
    --surface-soft:#152C41;
    --surface-hi:#1B3750;
    --ink:#EFF6FA;
    --ink-soft:#9DB7C8;
    --ink-faint:#6B8698;
    --teal-900:#061019;
    --teal-700:#1A4E72;
    --teal-600:#1C6FA6;
    --teal-500:#2E93CB;
    --teal-400:#52B7E0;
    --heading:#8FDCEF;
    --teal-100:rgba(46,147,203,.16);
    --coral:#E8815F;
    --coral-hi:#F0946F;
    --coral-soft:rgba(232,129,95,.16);
    --amber:#EFB753;
    --amber-soft:rgba(239,183,83,.16);
    --orange:#EA8C3B;
    --orange-hi:#F2A25C;
    --orange-soft:rgba(234,140,59,.16);
    --line:#1E3A4E;
    --line-soft:#17293A;
    --danger:#E2695A;
    --radius-sm:0;
    --radius:0;
    --radius-lg:0;
    --shadow-sm:0 1px 2px rgba(0,0,0,.24);
    --shadow:0 2px 4px rgba(0,0,0,.24), 0 12px 28px rgba(0,0,0,.32);
    --shadow-lg:0 8px 16px rgba(0,0,0,.28), 0 24px 48px rgba(0,0,0,.4);
    --ease:cubic-bezier(.25,.8,.35,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Thai', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{ font-family:'Taviraj', serif; font-weight:600; letter-spacing:.2px; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; }
  ::selection{ background:var(--teal-500); color:#04121C; }

  #app{
    max-width:720px; margin:0 auto; min-height:100vh; background:var(--bg);
    background-image:var(--bg-grad);
    display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }

  .app-banner{
    background:var(--teal-100); color:var(--heading); font-size:12px; text-align:center;
    padding:8px 10px; font-weight:600; letter-spacing:.01em;
    border-bottom:1px solid rgba(143,224,203,.12);
  }
  .app-banner.warn{ background:var(--amber-soft); color:#F0C878; border-bottom-color:rgba(239,183,83,.2); }

  .topbar{
    background:linear-gradient(155deg, var(--teal-500) 0%, var(--teal-600) 55%, var(--teal-700) 100%);
    color:#fff;
    padding:16px 18px;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 4px 20px rgba(4,20,17,.35);
  }
  .topbar .wave{
    width:30px; height:30px; flex:none; padding:5px; border-radius:0;
    background:rgba(255,255,255,.14);
  }
  .topbar h1{ font-size:19.5px; margin:0; color:#fff; flex:1; letter-spacing:.1px; }
  .topbar .sub{ font-size:11.5px; color:rgba(255,255,255,.8); margin-top:2px; font-weight:500; }

  .weather-banner{
    background:linear-gradient(155deg, var(--teal-600) 0%, var(--teal-700) 65%, #0E3049 100%);
    border-bottom:1px solid var(--line); padding:16px 18px 14px 18px;
  }
  .weather-today{ display:flex; align-items:center; gap:14px; }
  .wb-icon{ font-size:42px; line-height:1; flex:none; }
  .wb-location{ font-size:11.5px; color:rgba(255,255,255,.7); font-weight:600; letter-spacing:.02em; margin-bottom:2px; }
  .wb-temp{ font-size:32px; font-weight:700; font-family:'Taviraj',serif; color:#fff; line-height:1; }
  .wb-label{ font-size:12.5px; color:rgba(255,255,255,.82); margin-top:4px; font-weight:500; }
  .weather-forecast{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-top:14px; -webkit-overflow-scrolling:touch; }
  .weather-forecast::-webkit-scrollbar{ display:none; }
  .wf-day{
    flex:none; min-width:70px; background:linear-gradient(160deg, rgba(255,255,255,.17), rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.2); border-radius:20px;
    padding:13px 8px; text-align:center; box-shadow:0 4px 12px rgba(4,20,17,.18);
  }
  .wf-day:first-child{
    background:linear-gradient(160deg, rgba(255,255,255,.36), rgba(255,255,255,.14));
    border-color:rgba(255,255,255,.45);
  }
  .wf-day-label{ font-size:10px; color:rgba(255,255,255,.7); font-weight:700; text-transform:uppercase; letter-spacing:.02em; }
  .wf-icon{ font-size:21px; margin:6px 0; }
  .wf-temp{ font-size:11.5px; font-weight:700; color:#fff; }
  .wf-rain{ font-size:9.5px; color:rgba(255,255,255,.75); margin-top:3px; }
  .wb-manual-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.14); }
  .wb-manual-note{ font-size:12.5px; color:#fff; font-weight:600; }
  .wb-manual-hint{ font-size:12px; color:rgba(255,255,255,.6); }
  .wb-manual-row button, .wb-manual-edit-actions button{
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3); color:#fff;
    font-size:11.5px; font-weight:600; padding:5px 10px; cursor:pointer; flex:none; font-family:inherit;
  }
  .wb-manual-row button:hover, .wb-manual-edit-actions button:hover{ background:rgba(255,255,255,.26); }
  .wb-manual-edit{ margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.14); }
  .wb-manual-edit input{
    width:100%; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3); color:#fff;
    font-size:13px; padding:8px 10px; font-family:inherit; border-radius:0;
  }
  .wb-manual-edit input::placeholder{ color:rgba(255,255,255,.5); }
  .wb-manual-edit-actions{ display:flex; gap:8px; margin-top:8px; }
  .wb-manual-edit-actions button:first-child{ background:rgba(255,255,255,.92); color:var(--teal-700); border-color:transparent; }
  .icon-btn{
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#fff;
    width:36px; height:36px; border-radius:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none; transition:background .15s var(--ease), transform .15s var(--ease);
  }
  .icon-btn:hover{ background:rgba(255,255,255,.18); }
  .icon-btn:active{ transform:scale(.92); }

  .backbar{ display:flex; align-items:center; gap:8px; padding:14px 16px 0 16px; }
  .back-btn{
    background:var(--surface-hi); border:1.5px solid var(--teal-500); color:var(--heading); font-size:14.5px; font-weight:700;
    display:flex; align-items:center; gap:6px; cursor:pointer; padding:9px 16px 9px 12px; border-radius:0;
    transition:background .15s var(--ease), border-color .15s var(--ease), transform .12s var(--ease);
  }
  .back-btn:hover{ background:var(--teal-100); border-color:var(--teal-400); }
  .back-btn:active{ background:var(--surface-soft); transform:scale(.97); }
  .backbar-bottom{ padding:8px 16px 4px 16px; }
  .backbar-bottom .back-btn{ width:100%; justify-content:center; padding:12px 16px; }

  main{ flex:1; padding:16px 16px 32px 16px; animation:viewIn .28s var(--ease); }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

  .farm-tabs{ display:flex; flex-wrap:wrap; gap:8px; padding:14px 16px 4px 16px; }
  .farm-tab{
    flex:none; padding:8px 15px; border-radius:0; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); font-size:13.5px; font-weight:500;
    cursor:pointer; white-space:nowrap; transition:all .18s var(--ease);
  }
  .farm-tab:hover{ border-color:var(--teal-500); color:var(--ink); }
  .farm-tab.active{
    background:linear-gradient(135deg, var(--teal-500), var(--teal-600));
    border-color:transparent; color:#fff; box-shadow:0 4px 14px rgba(46,147,203,.35);
    font-weight:600;
  }

  .farm-title-row{ display:flex; align-items:center; justify-content:space-between; margin:8px 0 14px 0; gap:10px; flex-wrap:wrap; }
  .farm-title-row h2{ font-size:21px; margin:0; color:var(--heading); }
  .sort-select{
    appearance:none; -webkit-appearance:none; background:var(--surface-soft); border:1px solid var(--line);
    border-radius:0; color:var(--ink-soft); font-size:12.5px; font-weight:600; padding:7px 28px 7px 10px;
    cursor:pointer; font-family:inherit; color-scheme:dark;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%239DB7C8' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center;
  }
  .sort-select:hover{ border-color:var(--teal-500); color:var(--heading); }

  .action-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .action-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface-soft); border:1px solid var(--line); color:var(--ink-soft); font-size:12px;
    cursor:pointer; padding:7px 12px; border-radius:0; font-weight:600; transition:all .15s var(--ease);
  }
  .action-btn:hover{ color:var(--heading); border-color:var(--teal-500); }
  .action-btn.danger{ color:var(--danger); }
  .action-btn.danger:hover{ color:var(--danger); border-color:var(--danger); }
  .action-btn svg{ flex-shrink:0; opacity:.9; }


  .pond-grid{ display:grid; grid-template-columns:1fr; gap:10px; }
  .pond-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 15px; box-shadow:var(--shadow-sm); cursor:pointer; position:relative;
    transition:transform .16s var(--ease), box-shadow .16s var(--ease), border-color .16s var(--ease);
  }
  .pond-card::before{
    content:''; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:0;
    background:linear-gradient(var(--teal-400), var(--teal-600)); opacity:.85;
  }
  .pond-card{ padding-left:19px; }
  .pond-card:hover{ border-color:var(--teal-500); box-shadow:var(--shadow); transform:translateY(-1px); }
  .pond-card:active{ transform:scale(.99); }
  .pond-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .pond-card h3{ margin:0; font-size:16.5px; color:var(--heading); }
  .pond-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .doc-chip{ background:var(--teal-100); color:var(--teal-400); font-size:11px; font-weight:700; padding:3px 9px; border-radius:0; flex:none; letter-spacing:.01em; }
  .stat-row{ display:flex; gap:8px; margin-top:10px; }
  .stat{ flex:1; background:var(--surface-soft); border-radius:var(--radius-sm); padding:7px 10px; border:1px solid var(--line-soft); }
  .stat .label{ font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  .stat .val{ font-size:17px; font-weight:700; color:var(--ink); margin-top:1px; font-family:'Taviraj',serif; }
  .stat .val.coral{ color:var(--coral); }
  .stat .val.amber{ color:var(--amber); }
  .empty-state{ text-align:center; padding:56px 20px; color:var(--ink-faint); }
  .empty-state svg{ margin-bottom:12px; opacity:.6; }
  .empty-state p{ font-size:13.5px; margin:4px 0; line-height:1.6; }
  .empty-state p b{ color:var(--ink-soft); }

  .fab{
    width:100%; margin-top:16px;
    background:linear-gradient(135deg, var(--coral-hi), var(--coral)); color:#fff; border:none; border-radius:var(--radius);
    padding:14px 16px; font-size:14.5px; font-weight:700; box-shadow:0 8px 22px rgba(232,129,95,.3);
    display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
    transition:transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  .fab:hover{ box-shadow:0 10px 26px rgba(232,129,95,.4); }
  .fab:active{ transform:scale(.98); }

  /* Farm view: sidebar list on wide screens, full-page list/detail on narrow screens */
  .farm-split{ flex:1; display:block; }
  .farm-sidebar-mobile{ padding:16px 16px 32px 16px; animation:viewIn .28s var(--ease); }
  .farm-sidebar-desktop{ display:none; }
  .farm-main{ display:none; }
  .farm-split.has-selection .farm-sidebar-mobile{ display:none; }
  .farm-split.has-selection .farm-main{ display:block; }
  .split-placeholder{ padding:16px; }

  .pond-sidebar-list{ display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  .pond-sidebar-row{
    display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:12px 14px; cursor:pointer; position:relative;
    font-family:inherit; transition:border-color .15s var(--ease), background .15s var(--ease);
  }
  .pond-sidebar-row:hover{ border-color:var(--teal-500); }
  .pond-sidebar-row.active{ background:var(--surface-hi); border-color:var(--teal-500); box-shadow:0 0 0 1px var(--teal-500); }
  .pond-sidebar-row .psr-name{ font-weight:700; font-size:14.5px; color:var(--heading); font-family:'Taviraj',serif; }
  .pond-sidebar-row .psr-meta{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }

  @media (min-width: 860px){
    #app{ max-width:1120px; }
    .farm-split{ display:flex; gap:24px; align-items:flex-start; padding:16px 16px 32px 16px; }
    .farm-sidebar-mobile{ display:none !important; }
    .farm-sidebar-desktop{ display:block !important; flex:0 0 300px; position:sticky; top:16px; }
    .farm-main{ display:block !important; flex:1; min-width:0; }
    .farm-main main{ padding:0; animation:none; }
    .split-placeholder{ padding:56px 20px; }
  }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px;
    box-shadow:var(--shadow-sm); margin-bottom:16px;
  }
  .card h3{
    margin:0 0 14px 0; font-size:18.5px; color:var(--heading); display:flex; align-items:center; gap:7px;
    position:relative; padding-left:11px;
  }
  .card h3::before{ content:''; position:absolute; left:0; top:1px; bottom:1px; width:3px; border-radius:0; background:currentColor; opacity:.55; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13.5px; color:var(--ink-soft); margin-bottom:6px; font-weight:600; letter-spacing:.01em; }
  .field input, .field select, .field textarea{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    font-size:15px; font-weight:600; color:var(--ink); background:var(--surface-hi);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.18);
    transition:border-color .15s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease);
  }
  .field input[type=number], .field input[type=date]{ max-width:220px; }
  .field input::placeholder, .field textarea::placeholder{ color:var(--ink-faint); font-weight:400; }
  .field select{ color-scheme:dark; }
  .field input[type=date]{ color-scheme:dark; }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--teal-500);
    box-shadow:0 0 0 3px rgba(46,147,203,.28);
  }
  .field-row{ display:flex; flex-wrap:nowrap; gap:10px; }
  .field-row > .field{ flex:1 1 200px; min-width:0; }
  .field-row > .field:has(input[type=number]), .field-row > .field:has(input[type=date]){ flex:0 1 220px; }
  .hint{ font-size:11.5px; color:var(--ink-faint); margin-top:5px; }

  .feedpct-value{ color:var(--teal-400); font-weight:700; font-family:'Taviraj',serif; margin-left:4px; }
  .field input[type=range]{
    width:100%; padding:0; border:none; background:none; box-shadow:none;
    -webkit-appearance:none; appearance:none; height:20px; cursor:pointer; margin:6px 0 0 0;
  }
  .field input[type=range]:focus{ outline:none; box-shadow:none; }
  .field input[type=range]::-webkit-slider-runnable-track{
    height:6px; background:var(--surface-hi); border:1px solid var(--line);
  }
  .field input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:18px; height:18px;
    background:var(--teal-400); border:none; cursor:pointer; margin-top:-7px;
  }
  .field input[type=range]::-moz-range-track{
    height:6px; background:var(--surface-hi); border:1px solid var(--line);
  }
  .field input[type=range]::-moz-range-thumb{
    width:18px; height:18px; background:var(--teal-400); border:none; cursor:pointer; border-radius:0;
  }

  .form-section-label{
    font-size:14.5px; font-weight:700; color:var(--heading); margin:22px 0 14px 0;
    padding-bottom:8px; border-bottom:1px solid var(--line-soft);
  }
  .form-section-label:first-child{ margin-top:0; }
  .info-note{ background:var(--surface-soft); border-radius:var(--radius-sm); padding:10px 12px; font-size:12.5px; color:var(--ink-soft); margin:14px 0; line-height:1.5; }
  .calc-box{ border:1.5px dashed var(--line); border-radius:var(--radius); padding:14px; margin:18px 0 13px 0; }
  .calc-box-label{ font-size:12.5px; font-weight:700; color:var(--heading); margin-bottom:10px; }
  .calc-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .calc-tile{ background:var(--surface-hi); border-radius:0; padding:11px 8px; text-align:center; }
  .calc-tile .n{ font-size:16px; font-weight:700; color:var(--teal-400); font-family:'Taviraj',serif; }
  .calc-tile .l{ font-size:10.5px; color:var(--ink-faint); margin-top:3px; }
  .field label .info-hint{ color:var(--ink-faint); font-weight:400; cursor:help; }

  .stats-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:16px 14px; }
  .stats-group-title{ font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; }
  .dist-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:6px; }
  .dist-cell{ background:var(--surface-soft); border-radius:var(--radius-sm); padding:7px 8px; text-align:center; }
  .dist-pct{ color:var(--teal-400); font-weight:700; font-family:'Taviraj',serif; font-size:15px; display:block; }
  .dist-label{ color:var(--ink); font-weight:600; font-size:10.5px; margin-top:2px; display:block; line-height:1.3; }
  .dist-count{ color:var(--ink-faint); font-weight:400; font-size:9.5px; }

  .btn{ border:none; border-radius:var(--radius-sm); padding:12px 16px; font-size:14px; font-weight:600; cursor:pointer; transition:transform .12s var(--ease), background .15s var(--ease), opacity .15s var(--ease); }
  .btn-primary{ background:linear-gradient(135deg, var(--teal-500), var(--teal-600)); color:#fff; width:100%; box-shadow:0 6px 16px rgba(31,110,95,.35); }
  .btn-primary:hover{ box-shadow:0 8px 20px rgba(31,110,95,.45); }
  .btn-primary:active{ transform:scale(.98); }
  .btn-primary:disabled{ opacity:.6; cursor:default; transform:none; }
  .btn-secondary{ background:var(--surface-soft); color:var(--ink); border:1px solid var(--line); }
  .btn-secondary:hover{ border-color:var(--teal-500); }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn-danger:hover{ background:#EA7C6F; }
  .btn-danger:disabled{ opacity:.4; cursor:default; background:var(--surface-soft); color:var(--ink-faint); }
  .btn-harvest{ background:var(--teal-400); color:#04121C; }
  .btn-harvest:hover{ background:#6BC3E5; }
  .btn-harvest:active{ transform:scale(.98); }
  .btn-closepond{ background:var(--orange-hi); color:#3A2408; }
  .btn-closepond:hover{ background:#F5AD6C; }
  .btn-closepond:active{ transform:scale(.98); }
  .btn-block{ width:100%; }
  .btn-row{ display:flex; gap:10px; margin-top:4px; }

const FARM_SEED = ['ฟาร์ม 1','ฟาร์ม 2','ฟาร์ม 3','ฟาร์ม 4','ฟาร์ม 5'];

/* ---------------- Weather ---------------- */
const WEATHER_API_URL = 'https://api.open-meteo.com/v1/forecast?latitude=7.9514&longitude=98.9978&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,rain,precipitation,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FBangkok&forecast_days=7';
const WEATHER_LOCATION_LABEL = 'กระบี่';
const WEATHER_CACHE_KEY = 'shrimpfarm_weather_cache_v1';
const WEATHER_CODE_MAP = {
  0:{icon:'☀️',label:'ท้องฟ้าแจ่มใส'}, 1:{icon:'🌤️',label:'มีเมฆบางส่วน'}, 2:{icon:'⛅',label:'มีเมฆเป็นบางช่วง'}, 3:{icon:'☁️',label:'เมฆมาก'},
  45:{icon:'🌫️',label:'หมอก'}, 48:{icon:'🌫️',label:'หมอกน้ำแข็ง'},
  51:{icon:'🌦️',label:'ฝนตกปรอยๆเบา'}, 53:{icon:'🌦️',label:'ฝนตกปรอยๆ'}, 55:{icon:'🌦️',label:'ฝนตกปรอยๆหนัก'},
  56:{icon:'🌧️',label:'ฝนเยือกแข็งเบา'}, 57:{icon:'🌧️',label:'ฝนเยือกแข็งหนัก'},
  61:{icon:'🌧️',label:'ฝนตกเบา'}, 63:{icon:'🌧️',label:'ฝนตกปานกลาง'}, 65:{icon:'🌧️',label:'ฝนตกหนัก'},
  66:{icon:'🌧️',label:'ฝนเยือกแข็งเบา'}, 67:{icon:'🌧️',label:'ฝนเยือกแข็งหนัก'},
  71:{icon:'❄️',label:'หิมะตกเบา'}, 73:{icon:'❄️',label:'หิมะตกปานกลาง'}, 75:{icon:'❄️',label:'หิมะตกหนัก'}, 77:{icon:'❄️',label:'เกล็ดหิมะ'},
  80:{icon:'🌦️',label:'ฝนซู่เบา'}, 81:{icon:'🌦️',label:'ฝนซู่ปานกลาง'}, 82:{icon:'🌧️',label:'ฝนซู่หนัก'},
  85:{icon:'🌨️',label:'หิมะซู่เบา'}, 86:{icon:'🌨️',label:'หิมะซู่หนัก'},
  95:{icon:'⛈️',label:'พายุฝนฟ้าคะนอง'}, 96:{icon:'⛈️',label:'พายุฝนฟ้าคะนองมีลูกเห็บ'}, 99:{icon:'⛈️',label:'พายุฝนฟ้าคะนองรุนแรง'},
};
let weatherData = null; // { tempC, humidity, rainPct, code, updatedAt }

function weatherIconLabel(code){
  return WEATHER_CODE_MAP[code] || { icon:'🌡️', label:'' };
}
function weekdayShortTh(dateStr, isToday){
  if(isToday) return 'วันนี้';
  try{
    return new Intl.DateTimeFormat('th-TH', { weekday:'short' }).format(new Date(dateStr+'T00:00:00'));
  }catch(e){ return ''; }
}
function loadWeatherCache(){
  try{
    const raw = localStorage.getItem(WEATHER_CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveWeatherCache(data){
  try{ localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(data)); }catch(e){}
}
async function fetchWeather(){
  try{
    const res = await fetch(WEATHER_API_URL);
    if(!res.ok) throw new Error('bad response: '+res.status);
    const json = await res.json();
    const h = json.hourly;
    if(!h || !Array.isArray(h.time) || h.time.length===0) throw new Error('no hourly data');
    const nowMs = Date.now();
    let idx = 0, bestDiff = Infinity;
    h.time.forEach((t,i)=>{
      const diff = Math.abs(new Date(t).getTime() - nowMs);
      if(diff < bestDiff){ bestDiff = diff; idx = i; }
    });
    const d = json.daily;
    const daily = (d && Array.isArray(d.time)) ? d.time.map((date,i)=>({
      date,
      code: d.weather_code[i],
      tempMax: d.temperature_2m_max[i],
      tempMin: d.temperature_2m_min[i],
      rainPct: d.precipitation_probability_max ? d.precipitation_probability_max[i] : null,
    })) : [];
    const data = {
      tempC: h.temperature_2m[idx],
      humidity: h.relative_humidity_2m[idx],
      rainPct: h.precipitation_probability[idx],
      code: h.weather_code[idx],
      daily,
      updatedAt: Date.now(),
    };
    weatherData = data;
    saveWeatherCache(data);
    render();
  }catch(e){
    console.warn('weather fetch failed', e);
  }
}
function initWeather(){
  const cached = loadWeatherCache();
  if(cached) weatherData = cached;
  fetchWeather();
}
function weatherManualNoteHtml(){

        <div class="wb-manual-edit-actions">
          <button type="button" id="btn-save-weather-note">บันทึก</button>
          <button type="button" id="btn-cancel-weather-note">ยกเลิก</button>
        </div>
      </div>`;
  }
  const hasNote = todayNote && todayNote.note;
  return `
    <div class="wb-manual-row">
      ${hasNote ? `<span class="wb-manual-note">📝 ${escapeHtml(todayNote.note)}</span>` : `<span class="wb-manual-hint">ยังไม่ได้บันทึกสภาพอากาศวันนี้เอง</span>`}
      <button type="button" id="btn-edit-weather-note">${hasNote ? 'แก้ไข' : '+ บันทึกเอง'}</button>
    </div>`;
}
function weatherBannerHtml(){
  const hasForecast = !!weatherData;
  if(!hasForecast && !todayWeatherNoteVal() && !editingWeatherNote) return '';
  const iconLabel = hasForecast ? weatherIconLabel(weatherData.code) : { icon:'', label:'' };
  const daily = hasForecast ? (weatherData.daily || []) : [];
  return `
    <div class="weather-banner">
      ${hasForecast ? `
      <div class="weather-today">
        <span class="wb-icon">${iconLabel.icon}</span>
        <div>
          <div class="wb-location">📍 ${escapeHtml(WEATHER_LOCATION_LABEL)}</div>
          <div class="wb-temp">${Math.round(weatherData.tempC)}°C</div>
          <div class="wb-label">${escapeHtml(iconLabel.label)}${weatherData.rainPct!=null ? ` · โอกาสฝน ${Math.round(weatherData.rainPct)}%` : ''}</div>
        </div>
      </div>` : ''}
      ${daily.length>0 ? `
      <div class="weather-forecast">
        ${daily.map((d,i)=>{
          const dl = weatherIconLabel(d.code);
          return `
            <div class="wf-day">
              <div class="wf-day-label">${escapeHtml(weekdayShortTh(d.date, i===0))}</div>
              <div class="wf-icon">${dl.icon}</div>
              <div class="wf-temp">${Math.round(d.tempMax)}°/${Math.round(d.tempMin)}°</div>
              ${d.rainPct!=null ? `<div class="wf-rain">💧${Math.round(d.rainPct)}%</div>` : ''}

}

/* ---------------- Utilities ---------------- */
function fmtDate(iso){ if(!iso) return '-'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'2-digit'}); }
function daysBetween(a,b){ const d1=new Date(a+'T00:00:00'), d2=new Date(b+'T00:00:00'); return Math.round((d2-d1)/86400000); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function weightFromCount(count){ if(!count||count<=0) return null; return 1000/count; }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

async function ensureFarmsSeeded(){
  if(seededFarms) return;
  seededFarms = true;
  try{
    const snap = await Promise.race([
      db.collection('farms').limit(1).get(),
      new Promise((_, reject)=>setTimeout(()=>reject(new Error('timed out')), 10000)),
    ]);
    if(snap.empty){
      const batch = db.batch();
      FARM_SEED.forEach((name,i)=>{
        batch.set(db.collection('farms').doc('farm'+(i+1)), { name, order:i });
      });
      await batch.commit();
    }
  }catch(e){
    console.error('seed farms failed', e);
    seededFarms = false; // allow a retry on the next auth state change (e.g. reconnect)
  }
}

/* ---------------- "Updated recently" badge (per-device, not synced) ---------------- */
const POND_VIEWED_KEY = 'shrimp-farm-pond-viewed';
const UPDATE_BADGE_MAX_AGE_MS = 2 * 24 * 60 * 60 * 1000; // 2 days

function pondLastActivityAt(pond){
  const recs = recordsForPond(pond.id);
  const recMax = recs.reduce((max,r)=> (r.updatedAt && r.updatedAt>max) ? r.updatedAt : max, 0);
  return Math.max(pond.updatedAt||0, recMax);
}
function getPondViewedMap(){
  try{ return JSON.parse(localStorage.getItem(POND_VIEWED_KEY) || '{}'); }
  catch(e){ return {}; }
}
function markPondViewed(pondId){
  try{
    const map = getPondViewedMap();
    map[pondId] = Date.now();
    localStorage.setItem(POND_VIEWED_KEY, JSON.stringify(map));
  }catch(e){}
}
function isPondRecentlyUpdated(pond){
  const lastActivity = pondLastActivityAt(pond);
  if(!lastActivity) return false;
  if(Date.now() - lastActivity > UPDATE_BADGE_MAX_AGE_MS) return false;
  const viewedAt = getPondViewedMap()[pond.id] || 0;
  return lastActivity > viewedAt;
}
function recordsForPond(pondId){
  return state.records.filter(r=>r.pondId===pondId).slice().sort((a,b)=>a.weekDate.localeCompare(b.weekDate));
}
function isPondClosed(pond){
  return !!pond.closedAt && recordsForPond(pond.id).length === 0;
}
function harvestsForPond(pondId){
  return state.harvests.filter(h=>h.pondId===pondId).slice().sort((a,b)=>(a.harvestDate||'').localeCompare(b.harvestDate||''));
}
function closuresForPond(pondId){
  return state.closures.filter(c=>c.pondId===pondId).slice().sort((a,b)=>(a.closeDate||'').localeCompare(b.closeDate||''));
}
function allClosuresSorted(){
  return state.closures.slice().sort((a,b)=>(b.closeDate||'').localeCompare(a.closeDate||'') || (b.createdAt||0)-(a.createdAt||0));
}

/* ---------------- Closures summary stat distributions ---------------- */
function speciesShortLabel(species){
  if(!species) return null;
  const s = species.split('(')[0].trim();
  return s || null;
}
function quarterLabel(dateStr){
  if(!dateStr || dateStr.length < 7) return null;
  const month = parseInt(dateStr.slice(5,7), 10);
  if(!month) return null;
  const q = Math.ceil(month/3);
  return `ไตรมาส ${q} (${dateStr.slice(0,4)})`;
}
function sizeRangeLabel(size){
  if(size==null) return null;
  if(size<=40) return '≤40 ตัว/กก.';
  if(size<=60) return '41-60 ตัว/กก.';
  if(size<=80) return '61-80 ตัว/กก.';
  if(size<=100) return '81-100 ตัว/กก.';
  if(size<=150) return '101-150 ตัว/กก.';
  return '150+ ตัว/กก.';
}
function docRangeLabel(doc){
  if(doc==null) return null;
  if(doc<60) return '<60 วัน';
  if(doc<80) return '60-79 วัน';
  if(doc<100) return '80-99 วัน';
  if(doc<120) return '100-119 วัน';
  return '120+ วัน';
}
function survivalRangeLabel(pct){
  if(pct==null) return null;
  if(pct<30) return '<30%';
  if(pct<50) return '30-49%';
  if(pct<70) return '50-69%';
  if(pct<90) return '70-89%';
  return '90%+';
}
function buildDistribution(closures, labelFn){
  const counts = {};
  let total = 0;
  closures.forEach(c=>{
    const label = labelFn(c);
    if(!label) return;
    counts[label] = (counts[label]||0) + 1;
    total++;
  });
  return Object.entries(counts)
    .map(([label,count])=>({ label, count, pct: total ? (count/total*100) : 0 }))
    .sort((a,b)=> b.count-a.count);
}

/* ---------------- Pathogen results (written by the weekly culture-log app) ---------------- */
// Pathogen fields live directly on the pond doc (pathogenStatus/pathogenSeverity/
// pathogenWorsened/pathogenDate = latest result, pathogenHistory[] = every week's result)
// written by a separate lab-report import tool — not entered here, and never touching
// `records` (this app's own weekly growth/feed log). ammonia/nitrite (mg/L) are optional
// on both the flat pond fields (pathogenAmmonia/pathogenNitrite) and each history entry
// (ammonia/nitrite) — shown only when the import tool actually supplied them.
const PATHOGEN_SEVERITY_LABEL = { critical:'วิกฤต', watch:'เฝ้าระวัง', normal:'ปกติ' };
const PATHOGEN_SEVERITY_CLASS = { critical:'coral', watch:'amber', normal:'good' };
function latestPathogenInfo(pond){
  if(!pond || !pond.pathogenSeverity) return null;
  return {
    weekDate:pond.pathogenDate, status:pond.pathogenStatus, severity:pond.pathogenSeverity, worsened:pond.pathogenWorsened,
    ammonia:pond.pathogenAmmonia!=null?pond.pathogenAmmonia:null, nitrite:pond.pathogenNitrite!=null?pond.pathogenNitrite:null,
  };
}
function pathogenHistoryForPond(pond){
  return (pond && pond.pathogenHistory) ? pond.pathogenHistory.slice().sort((a,b)=>(a.weekDate||'').localeCompare(b.weekDate||'')) : [];
}
function pathogenExtraValuesHtml(entry){
  if(!entry) return '';
  const parts = [];
  if(entry.ammonia!=null) parts.push(`แอมโมเนีย ${entry.ammonia} mg/L`);
  if(entry.nitrite!=null) parts.push(`ไนไตรต์ ${entry.nitrite} mg/L`);
  if(parts.length===0) return '';
  return `<div class="pe-water">${parts.join(' · ')}</div>`;
}
function pathogenChipHtml(severity, status){
  if(!severity) return '';
  const cls = PATHOGEN_SEVERITY_CLASS[severity] || '';
  const label = PATHOGEN_SEVERITY_LABEL[severity] || severity;
  return `<span class="pathogen-chip ${cls}" title="${escapeHtml(status||'')}">เชื้อ: ${escapeHtml(label)}</span>`;
}
function metaRowHtml(items){
  const valid = items.filter(Boolean);
  if(valid.length === 0) return '';
  return `
    <div class="meta-row">
      ${valid.map((it,i)=>`${i>0 ? '<span class="meta-dot">·</span>' : ''}<span class="meta-item ${it.cls||''}">${it.text}</span>`).join('')}
    </div>`;
}
function computeAdgForPond(p, recs){
  if(!recs || recs.length===0) return null;
  const last = recs[recs.length-1];
  const lastWeight = weightFromCount(last.sizeCount);
  if(lastWeight===null) return null;
  if(recs.length>=2){
    const prev = recs[recs.length-2];
    const dDays = daysBetween(prev.weekDate, last.weekDate);
    const wPrev = weightFromCount(prev.sizeCount);
    if(dDays>0 && wPrev!==null) return (lastWeight-wPrev)/dDays;
  }
  if(p.releaseDate){
    const doc = daysBetween(p.releaseDate, last.weekDate);
    if(doc>0) return lastWeight/doc;
  }
  return null;
}
function estimatedBiomassKg(releaseCount, survivalRate, sizeCount){
  if(!releaseCount || survivalRate==null || !sizeCount) return null;
  const weightG = weightFromCount(sizeCount);
  if(weightG===null) return null;
  const survivingCount = releaseCount * (survivalRate/100);
  return survivingCount * weightG / 1000;
}
function estimatedSurvivingCount(releaseCount, survivalRate){
  if(!releaseCount || survivalRate==null) return null;
  return Math.round(releaseCount * (survivalRate/100));
}
function suggestedFeedPctRange(sizeCount){
  if(sizeCount==null) return null;
  if(sizeCount > 250) return { min:6, max:8 };
  if(sizeCount > 130) return { min:5, max:6 };
  if(sizeCount > 75) return { min:4, max:4.5 };
  if(sizeCount > 45) return { min:3, max:3.5 };
  return { min:2, max:2.5 };
}

        const adg = computeAdgForPond(pond, recs);
        return { pond, doc, last, adg };

    }))

function renderPondDetail(){
  const p = state.ponds.find(x=>x.id===currentPondId);
  if(!p){ currentPondId = null; return renderFarmDashboard(); }
  const records = recordsForPond(p.id);
  const pathogenRec = latestPathogenInfo(p);
  const pondBatches = state.batches
    .filter(b=>b.pondId===p.id)
    .slice()
    .sort((a,b)=>(b.savedAt||'').localeCompare(a.savedAt||''));
  const editingRecordThisRender = editingRecordId ? records.find(r=>r.id===editingRecordId) : null;
  const doc = p.releaseDate ? daysBetween(p.releaseDate, todayISO()) : null;
  const last = records[records.length-1];
  const lastWeight = last ? weightFromCount(last.sizeCount) : null;
  const cumAdg = (lastWeight && doc) ? (lastWeight/doc) : null;

  let weeklyAdg = null;
  if(records.length >= 2){
    const prev = records[records.length-2];
    const dDays = daysBetween(prev.weekDate, last.weekDate);
    const wPrev = weightFromCount(prev.sizeCount), wLast = weightFromCount(last.sizeCount);
    if(dDays>0 && wPrev!==null && wLast!==null) weeklyAdg = (wLast-wPrev)/dDays;
  }
  const pondHarvests = harvestsForPond(p.id);
  const totalHarvestedCount = pondHarvests.reduce((sum,h)=> sum + (h.caughtCount||0), 0);
  const totalHarvestedKg = pondHarvests.reduce((sum,h)=> sum + (h.weightKg||0), 0);
  const totalHarvestedRevenue = pondHarvests.reduce((sum,h)=> sum + (h.revenue||0), 0);
  const rawSurvivingCount = last ? estimatedSurvivingCount(p.releaseCount, last.survivalRate) : null;
  const estimatedSurviving = rawSurvivingCount!==null ? Math.max(0, rawSurvivingCount - totalHarvestedCount) : null;
  const estimatedYieldKg = (()=>{
    if(estimatedSurviving===null || !last || !last.sizeCount) return null;
    const weightG = weightFromCount(last.sizeCount);
    if(weightG===null) return null;
    return estimatedSurviving * weightG / 1000;
  })();
  const latestTotalFeedRecord = records.slice().reverse().find(r=>r.totalFeedKg!=null);
  const cumulativeBiomassKg = (estimatedYieldKg||0) + totalHarvestedKg;
  const currentFcr = (latestTotalFeedRecord && cumulativeBiomassKg>0) ? (latestTotalFeedRecord.totalFeedKg / cumulativeBiomassKg) : null;

  const rows = records.slice().reverse().map(r=>{
    const w = weightFromCount(r.sizeCount);
    const recDoc = p.releaseDate ? daysBetween(p.releaseDate, r.weekDate) : null;
    const weatherNote = weatherNotesByDate[r.weekDate];
    return `
      <tr>
        <td>${fmtDate(r.weekDate)}</td>
        <td>${weatherNote ? '📝 '+escapeHtml(weatherNote.note) : '-'}</td>
        <td>${recDoc!==null ? recDoc+' วัน' : '-'}</td>
        <td>${r.sizeCount!=null ? r.sizeCount+' ตัว/กก.<br><span style="color:var(--ink-faint);font-size:11px">'+(w?w.toFixed(1)+' ก.':'')+'</span>' : '-'}</td>
        <td>${r.feedPerDay!=null ? r.feedPerDay+' กก.' : '-'}</td>
        <td>${r.totalFeedKg!=null ? r.totalFeedKg.toLocaleString('th-TH')+' กก.' : '-'}</td>
        <td>${r.survivalRate!=null ? r.survivalRate+'%' : '-'}</td>
        <td>${r.note ? escapeHtml(r.note) : '-'}</td>
        <td><button class="row-del" data-edit-record="${r.id}" style="color:var(--teal-500)">แก้ไข</button> <button class="row-del" data-del-record="${r.id}">ลบ</button></td>
      </tr>`;
  }).join('');

  const pathogenHistory = pathogenHistoryForPond(p);
  const pathogenHistoryCount = pathogenHistory.length;
  const pathogenDaysAgo = (pathogenRec && pathogenRec.weekDate) ? daysBetween(pathogenRec.weekDate, todayISO()) : null;
  const pathogenLatestHtml = pathogenRec ? `
    <div class="card">
      <h3>ผลตรวจเชื้อล่าสุด</h3>
      <div class="pathogen-list">
        <div class="pathogen-entry ${PATHOGEN_SEVERITY_CLASS[pathogenRec.severity]||''}">
          <div class="pe-head">
            <span class="pe-date">${fmtDate(pathogenRec.weekDate)}${pathogenDaysAgo!==null ? ` · ${pathogenDaysAgo<=0?'วันนี้':pathogenDaysAgo+' วันที่แล้ว'}` : ''}</span>
            ${pathogenChipHtml(pathogenRec.severity, pathogenRec.status)}
            ${pathogenRec.worsened ? `<span class="pe-worse">▲ แย่ลงจากรอบก่อน</span>` : ''}
          </div>
          <div class="pe-text">${escapeHtml(pathogenRec.status||'-')}</div>
          ${pathogenExtraValuesHtml(pathogenRec)}
          ${pathogenHistoryCount>1 ? `<div style="margin-top:8px;font-size:11px;color:var(--ink-faint)">ตรวจสะสมมาแล้ว ${pathogenHistoryCount} ครั้ง</div>` : ''}
        </div>
      </div>
    </div>` : '';

  return `
    <div class="backbar">
      <button class="back-btn" id="btn-back">${ICONS.back} กลับ</button>
    </div>
    <main>
      <div class="pond-head">
        <h2>${escapeHtml(p.name)}</h2>
        ${metaRowHtml([
          { text: escapeHtml(p.species||'ยังไม่ระบุชนิด') },
          p.brand ? { text: `แบรนด์: ${escapeHtml(p.brand)}` } : null,
          p.releaseDate ? { text: `ปล่อย ${fmtDate(p.releaseDate)}`, cls:'coral' } : null,
          p.releaseCount ? { text: `จำนวนปล่อย ${Number(p.releaseCount).toLocaleString('th-TH')} ตัว` } : null,
          doc!==null ? { text: `DOC ${doc} วัน`, cls:'amber' } : null,
          pathogenRec ? { text: `ผลเชื้อ (${fmtDate(pathogenRec.weekDate)}): ${escapeHtml(PATHOGEN_SEVERITY_LABEL[pathogenRec.severity]||pathogenRec.severity)}`, cls: PATHOGEN_SEVERITY_CLASS[pathogenRec.severity]||'' } : null,
        ])}
        <div class="action-row">
          <button class="action-btn" id="btn-edit-pond">${ICONS.edit} แก้ไขข้อมูลบ่อ</button>
          <button class="action-btn" id="btn-open-biomass">คำนวณ Biomass</button>

        </div>
        <div class="summary-box coral">

function renderHarvestForm(){
  const p = state.ponds.find(x=>x.id===viewingHarvestPondId);
  if(!p){ viewingHarvestPondId = null; return renderPondDetail(); }
  const records = recordsForPond(p.id);
  const last = records[records.length-1];
  const pondHarvests = harvestsForPond(p.id);
  const totalHarvestedKg = pondHarvests.reduce((sum,h)=> sum + (h.weightKg||0), 0);
  const totalHarvestedRevenue = pondHarvests.reduce((sum,h)=> sum + (h.revenue||0), 0);
  const rawSurvivingCount = last ? estimatedSurvivingCount(p.releaseCount, last.survivalRate) : null;
  const totalHarvestedCount = pondHarvests.reduce((sum,h)=> sum + (h.caughtCount||0), 0);
  const currentRemaining = rawSurvivingCount!==null ? Math.max(0, rawSurvivingCount - totalHarvestedCount) : null;
  const currentSurvivalRatePct = (currentRemaining!==null && p.releaseCount) ? (currentRemaining / p.releaseCount * 100) : null;

  const rows = pondHarvests.slice().reverse().map(h=>`
    <tr>
      <td>${fmtDate(h.harvestDate)}</td>
      <td>${h.weightKg!=null ? h.weightKg.toLocaleString('th-TH')+' กก.' : '-'}</td>
      <td>${h.sizeCount!=null ? h.sizeCount+' ตัว/กก.' : '-'}</td>
      <td>${h.pricePerKg!=null ? h.pricePerKg.toLocaleString('th-TH')+' บ./กก.' : '-'}</td>
      <td>${h.revenue!=null ? h.revenue.toLocaleString('th-TH',{maximumFractionDigits:0})+' บ.' : '-'}</td>
      <td>${h.caughtCount!=null ? h.caughtCount.toLocaleString('th-TH')+' ตัว' : '-'}</td>
      <td>${h.remainingAfter!=null ? h.remainingAfter.toLocaleString('th-TH')+' ตัว' : '-'}${h.survivalRateAfter!=null ? '<br><span style="color:var(--ink-faint);font-size:11px">'+h.survivalRateAfter.toFixed(1)+'%</span>' : ''}</td>
      <td><button class="row-del" data-del-harvest="${h.id}">ลบ</button></td>
    </tr>`).join('');

  return `
    <div class="harvest-page">
    <div class="backbar">
      <button class="back-btn" id="btn-back-harvest">${ICONS.back} กลับ</button>
    </div>
    <main>
      <div class="pond-head">
        <h2>แบ่งจับ — ${escapeHtml(p.name)}</h2>
      </div>

      <div class="summary-strip">
        <div class="summary-box">
          <div class="n">${currentRemaining!==null ? currentRemaining.toLocaleString('th-TH') : '-'}</div>
          <div class="l">ตัว เหลือตอนนี้</div>
        </div>
        <div class="summary-box amber">
          <div class="n">${currentSurvivalRatePct!==null ? currentSurvivalRatePct.toFixed(1)+'%' : '-'}</div>
          <div class="l">อัตรารอดปัจจุบัน</div>
        </div>
        <div class="summary-box coral">
          <div class="n">${totalHarvestedKg.toLocaleString('th-TH',{maximumFractionDigits:1})}</div>
          <div class="l">กก. จับสะสม</div>
        </div>
      </div>

      <div class="card" id="harvest-form-card">
        <h3>บันทึกการแบ่งจับ</h3>
        <form id="harvest-form">
          <div class="field-row">
            <div class="field">
              <label>วันที่จับ</label>
              <input type="date" name="harvestDate" id="harvest-date" value="${todayISO()}" required>
            </div>
            <div class="field">
              <label>ไซส์ที่จับ (ตัว/กก.)</label>
              <input type="number" inputmode="decimal" step="0.1" name="sizeCount" id="harvest-size" placeholder="เช่น 60" required>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>น้ำหนักที่จับ (กก.)</label>
              <input type="number" inputmode="decimal" step="0.1" name="weightKg" id="harvest-weight" placeholder="เช่น 500" required>
            </div>
            <div class="field">
              <label>ราคา (บาท/กก.) (ถ้ามี)</label>
              <input type="number" inputmode="decimal" step="0.1" name="pricePerKg" id="harvest-price" placeholder="เช่น 120">
            </div>
          </div>
          <div class="field">
            <label>หมายเหตุ (ถ้ามี)</label>
            <input type="text" name="note" placeholder="เช่น จับหน้าฝน, ลูกค้า A">
          </div>
          <div style="background:var(--surface-hi);border-radius:0;padding:12px 14px;margin-bottom:13px;text-align:center;">
            <div style="font-size:11px;color:var(--ink-faint);">หลังแบ่งจับนี้ คาดว่าจะเหลือ</div>
            <div id="harvest-preview-remaining" style="font-size:20px;font-weight:700;color:var(--heading);font-family:'Taviraj',serif;margin-top:3px;">-</div>
            <div id="harvest-preview-caption" style="font-size:11px;color:var(--ink-faint);margin-top:2px;">ใส่น้ำหนักและไซส์ที่จับเพื่อคำนวณ</div>
          </div>
          <div class="btn-row">
            <button class="btn btn-primary" type="submit" style="flex:1">บันทึกการแบ่งจับ</button>
          </div>
        </form>
      </div>

      ${pondHarvests.length>0 ? `
      <div class="card">
        <h3>ประวัติการแบ่งจับ${totalHarvestedRevenue>0 ? ` · รวม ${totalHarvestedRevenue.toLocaleString('th-TH',{maximumFractionDigits:0})} บาท` : ''}</h3>
        <div style="overflow-x:auto">
          <table class="rec-table">
            <thead><tr><th>วันที่</th><th>น้ำหนัก</th><th>ไซส์</th><th>ราคา</th><th>มูลค่า</th><th>จับได้</th><th>เหลือหลังจับ</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>` : `<div class="empty-state">${ICONS.shrimp}<p>ยังไม่มีประวัติการแบ่งจับ</p></div>`}
      <div class="backbar-bottom">
        <button class="back-btn" id="btn-back-harvest-bottom" type="button">${ICONS.back} กลับ</button>
      </div>
    </main>
    </div>
  `;
}

function renderCloseForm(){
  const p = state.ponds.find(x=>x.id===viewingClosePondId);
  if(!p){ viewingClosePondId = null; return renderPondDetail(); }
  const farm = state.farms.find(f=>f.id===p.farmId);
  const records = recordsForPond(p.id);
  const last = records[records.length-1];
  const pondHarvests = harvestsForPond(p.id);
  const priorCaughtCount = pondHarvests.reduce((sum,h)=> sum + (h.caughtCount||0), 0);
  const priorKg = pondHarvests.reduce((sum,h)=> sum + (h.weightKg||0), 0);
  const lastHarvestWithPrice = pondHarvests.slice().reverse().find(h=>h.pricePerKg!=null);
  const rawSurvivingCount = last ? estimatedSurvivingCount(p.releaseCount, last.survivalRate) : null;
  const estimatedRemaining = rawSurvivingCount!==null ? Math.max(0, rawSurvivingCount - priorCaughtCount) : null;
  const suggestedWeightKg = (estimatedRemaining!==null && last && last.sizeCount) ? (estimatedRemaining / last.sizeCount) : null;
  const initialDoc = p.releaseDate ? daysBetween(p.releaseDate, todayISO()) : '';

  return `
    <div class="backbar">
      <button class="back-btn" id="btn-back-close">${ICONS.back} กลับ</button>
    </div>
    <main>
      <div class="pond-head">
        <h2>ปิดบ่อ — ${escapeHtml(p.name)}</h2>

            <div class="field">
              <label>ฟาร์มที่</label>
              <input type="text" name="farmName" id="close-farmname" placeholder="เช่น ฟาร์ม A" value="${escapeHtml(farm ? farm.name : '')}">
            </div>
            <div class="field">
              <label>บ่อที่</label>
              <input type="text" name="pondName" id="close-pondname" placeholder="เช่น บ่อ 1" value="${escapeHtml(p.name)}">
            </div>
          </div>

          <div class="form-section-label">ข้อมูลลูกกุ้งที่ปล่อย</div>
          <div class="field-row">
            <div class="field">
              <label>จำนวนปล่อยกุ้ง (ตัว)</label>
              <input type="number" inputmode="numeric" step="1" name="releaseCount" id="close-releasecount" placeholder="เช่น 500000" value="${p.releaseCount!=null ? p.releaseCount : ''}">
            </div>
            <div class="field">
              <label>ชนิดกุ้ง</label>
              <input type="text" name="species" id="close-species" placeholder="เช่น กุ้งขาว (Vannamei)" value="${escapeHtml(p.species||'')}">
            </div>
          </div>
          <div class="field">
            <label>ลูกกุ้งจากไหน</label>
            <input type="text" name="hatchery" id="close-hatchery" placeholder="เช่น ฟาร์มพ่อแม่พันธุ์ ABC" value="${escapeHtml(p.brand||'')}">
          </div>

          <div class="form-section-label">ผลการจับ</div>
          <div class="field-row">
            <div class="field">
              <label>ขนาดไซส์ (ตัว/กก.)</label>
              <input type="number" inputmode="decimal" step="0.1" name="sizeCount" id="close-size" placeholder="เช่น 50" value="${last && last.sizeCount!=null ? last.sizeCount : ''}">
            </div>
            <div class="field">
              <label>ราคา (บาท/กก.)</label>
              <input type="number" inputmode="decimal" step="0.1" name="pricePerKg" id="close-price" placeholder="เช่น 150" value="${lastHarvestWithPrice ? lastHarvestWithPrice.pricePerKg : ''}">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>จำนวนที่จับ (กก.)</label>
              <input type="number" inputmode="decimal" step="0.1" name="weightKg" id="close-weight" placeholder="เช่น 500" value="${suggestedWeightKg!=null ? suggestedWeightKg.toFixed(1) : ''}">

            <div class="field">
              <label>อาหารรวมทั้งหมด (กก.)</label>
              <input type="number" inputmode="decimal" step="0.1" name="totalFeedKg" id="close-feed" placeholder="เช่น 750">

      <div class="backbar-bottom">
        <button class="back-btn" id="btn-back-close-bottom" type="button">${ICONS.back} กลับ</button>
      </div>

function renderBiomassCalc(){
  const p = state.ponds.find(x=>x.id===viewingBiomassPondId);
  if(!p){ viewingBiomassPondId = null; return renderPondDetail(); }
  const recs = recordsForPond(p.id);
  const last = recs[recs.length-1];
  const initialSizeCount = last && last.sizeCount!=null ? last.sizeCount : null;
  const initialFeedRange = suggestedFeedPctRange(initialSizeCount);
  const initialFeedPct = initialFeedRange ? ((initialFeedRange.min+initialFeedRange.max)/2) : 3;

  return `
    <div class="backbar">
      <button class="back-btn" id="btn-back-biomass">${ICONS.back} กลับ</button>
    </div>
    <main>
      <div class="pond-head">
        <h2>คำนวณ Biomass — ${escapeHtml(p.name)}</h2>
      </div>

      <div class="card">
        <h3>ใส่ค่าเพื่อคำนวณ</h3>
        <div class="field-row">
          <div class="field">
            <label>จำนวนปล่อยกุ้ง (ตัว)</label>
            <input type="number" inputmode="numeric" step="1" id="biomass-release" placeholder="เช่น 500000" value="${p.releaseCount!=null ? p.releaseCount : ''}">
          </div>

/* ---------------- Charts ---------------- */
function svgLineChart({labels, values, color, fillColor}){
  const width = 300, height = 110;
  const padL = 32, padR = 8, padT = 10, padB = 20;
  const innerW = width - padL - padR;
  const innerH = height - padT - padB;

  const valid = values.map((v,i)=>({v,i})).filter(d=>d.v!==null && d.v!==undefined && !isNaN(d.v));
  if(valid.length===0){
    return `<div style="display:flex;align-items:center;justify-content:center;height:${height}px;color:var(--ink-faint);font-size:12.5px">ยังไม่มีข้อมูลเพียงพอ</div>`;
  }

  let min = Math.min(...valid.map(d=>d.v));
  let max = Math.max(...valid.map(d=>d.v));
  if(min === max){ const bump = Math.abs(min)*0.1 || 1; min -= bump; max += bump; }
  const rangePad = (max-min)*0.15;
  min -= rangePad; max += rangePad;
  if(min < 0 && valid.every(d=>d.v>=0)) min = 0;

  const n = labels.length;
  const xFor = i => n<=1 ? padL+innerW/2 : padL + (innerW * i/(n-1));
  const yFor = v => padT + innerH * (1 - (v-min)/(max-min));

  let gridLines = '';
  const gridCount = 3;
  for(let g=0; g<=gridCount; g++){
    const gv = min + (max-min)*g/gridCount;
    const gy = yFor(gv);
    gridLines += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${width-padR}" y2="${gy.toFixed(1)}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
    gridLines += `<text x="${padL-6}" y="${(gy+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#6B8698">${gv.toFixed(Math.abs(gv)<10?1:0)}</text>`;
  }

  let pathSegments = [], currentSeg = [];
  values.forEach((v,i)=>{
    if(v===null || v===undefined || isNaN(v)){
      if(currentSeg.length) pathSegments.push(currentSeg);
      currentSeg = [];
    } else {
      currentSeg.push([xFor(i), yFor(v)]);
    }
  });
  if(currentSeg.length) pathSegments.push(currentSeg);

  const pointRadius = valid.length<=2 ? 5.5 : 3.5;
  let linesHtml = '', areaHtml = '';
  pathSegments.forEach(seg=>{
    if(seg.length>=2){
      const d = seg.map((p,idx)=> (idx===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
      linesHtml += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
      const areaD = d + ` L${seg[seg.length-1][0].toFixed(1)},${(padT+innerH).toFixed(1)} L${seg[0][0].toFixed(1)},${(padT+innerH).toFixed(1)} Z`;
      areaHtml += `<path d="${areaD}" fill="${fillColor}" stroke="none"/>`;
    }
  });

  let pointsHtml = '';
  valid.forEach(d=>{
    const x = xFor(d.i), y = yFor(d.v);
    pointsHtml += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${pointRadius}" fill="${color}" stroke="#081824" stroke-width="1.5"/>`;
  });

  let xLabelsHtml = '';
  const maxLabels = 3;
  const step = Math.max(1, Math.ceil(n/maxLabels));
  labels.forEach((lab,i)=>{
    if(i%step===0 || i===n-1){
      const shortLab = lab.split('(')[0].trim();
      xLabelsHtml += `<text x="${xFor(i).toFixed(1)}" y="${height-5}" text-anchor="middle" font-size="9" fill="#6B8698">${escapeHtml(shortLab)}</text>`;
    }
  });

  return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="width:100%;height:${height}px;display:block">
    ${gridLines}${areaHtml}${linesHtml}${pointsHtml}${xLabelsHtml}
  </svg>`;
}

const PATHOGEN_SEVERITY_RANK = { normal:0, watch:1, critical:2 };
const PATHOGEN_SEVERITY_COLOR = { normal:'#52B7E0', watch:'#EFB753', critical:'#E8815F' };
function pathogenTrendChartHtml(history){
  if(!history || history.length===0){
    return `<div style="display:flex;align-items:center;justify-content:center;height:110px;color:var(--ink-faint);font-size:12.5px">ยังไม่มีข้อมูลเพียงพอ</div>`;
  }
  const width = 300, height = 110;
  const padL = 46, padR = 8, padT = 10, padB = 20;
  const innerW = width - padL - padR;
  const innerH = height - padT - padB;
  const n = history.length;
  const xFor = i => n<=1 ? padL+innerW/2 : padL + (innerW * i/(n-1));
  const yFor = rank => padT + innerH * (1 - rank/2);

  let gridLines = '';
  [['วิกฤต',2],['เฝ้าระวัง',1],['ปกติ',0]].forEach(([lab,rank])=>{
    const gy = yFor(rank);
    gridLines += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${width-padR}" y2="${gy.toFixed(1)}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
    gridLines += `<text x="${padL-6}" y="${(gy+3).toFixed(1)}" text-anchor="end" font-size="8" fill="#6B8698">${lab}</text>`;
  });

  const pts = history.map((h,i)=>[xFor(i), yFor(PATHOGEN_SEVERITY_RANK[h.severity]??0)]);
  const lineD = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const linesHtml = pts.length>=2 ? `<path d="${lineD}" fill="none" stroke="#9DB7C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>` : '';

  let pointsHtml = '';
  history.forEach((h,i)=>{
    const [x,y] = pts[i];
    pointsHtml += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${PATHOGEN_SEVERITY_COLOR[h.severity]||'#9DB7C8'}" stroke="#081824" stroke-width="1.5"/>`;
  });

  let xLabelsHtml = '';
  const maxLabels = 3;
  const step = Math.max(1, Math.ceil(n/maxLabels));
  history.forEach((h,i)=>{
    if(i%step===0 || i===n-1){
      xLabelsHtml += `<text x="${xFor(i).toFixed(1)}" y="${height-5}" text-anchor="middle" font-size="9" fill="#6B8698">${escapeHtml(fmtDate(h.weekDate))}</text>`;
    }
  });

  return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="width:100%;height:${height}px;display:block">
    ${gridLines}${linesHtml}${pointsHtml}${xLabelsHtml}
  </svg>`;
}

function drawChartsFor(records, releaseDate){
  if(records.length===0) return;
  const labels = records.map(r=>{
    const d = releaseDate ? daysBetween(releaseDate, r.weekDate) : null;
    return d!==null ? `${fmtDate(r.weekDate)} (DOC ${d})` : fmtDate(r.weekDate);
  });

  const sizeEl = document.getElementById('chart-size');
  if(sizeEl){
    const values = records.map(r=>{ const w=weightFromCount(r.sizeCount); return w? +w.toFixed(2):null; });
    sizeEl.innerHTML = svgLineChart({labels, values, color:'#2E93CB', fillColor:'rgba(46,147,203,.18)'});
  }

  const feedEl = document.getElementById('chart-feed');
  if(feedEl){
    const values = records.map(r=>r.feedPerDay);
    feedEl.innerHTML = svgLineChart({labels, values, color:'#EFB753', fillColor:'rgba(239,183,83,.18)'});
  }

  const adgEl = document.getElementById('chart-adg');
  if(adgEl && records.length>=2){
    const adgData = [null];
    for(let i=1;i<records.length;i++){
      const d = daysBetween(records[i-1].weekDate, records[i].weekDate);
      const w0 = weightFromCount(records[i-1].sizeCount), w1 = weightFromCount(records[i].sizeCount);
      adgData.push((d>0 && w0!==null && w1!==null) ? +(((w1-w0)/d)).toFixed(3) : null);
    }
    adgEl.innerHTML = svgLineChart({labels, values: adgData, color:'#E8815F', fillColor:'rgba(232,129,95,.18)'});
  }
}

function drawCharts(){
  const records = recordsForPond(currentPondId);
  const pondForChart = state.ponds.find(x=>x.id===currentPondId);
  drawChartsFor(records, pondForChart && pondForChart.releaseDate);
}

function drawBatchCharts(){
  const batch = state.batches.find(b=>b.id===viewingBatchId);
  if(!batch) return;
  drawChartsFor(batch.records || [], batch.releaseDate);
}

/* ---------------- Archive the current cycle's records/harvests into `batches`, then delete the pond (closing removes it entirely) ---------------- */
async function archivePondCycle(pond){
  const pondRecords = recordsForPond(pond.id);
  const pondHarvests = harvestsForPond(pond.id);
  if(pondRecords.length>0 || pondHarvests.length>0){
    const archivedRecords = pondRecords.map(r=>({
      weekDate:r.weekDate, sizeCount:r.sizeCount, feedPerDay:r.feedPerDay,
      totalFeedKg:r.totalFeedKg!=null?r.totalFeedKg:null,
      survivalRate:r.survivalRate!=null?r.survivalRate:null, note:r.note||'',
    }));
    const archivedHarvests = pondHarvests.map(h=>({
      harvestDate:h.harvestDate, weightKg:h.weightKg, sizeCount:h.sizeCount,
      pricePerKg:h.pricePerKg!=null?h.pricePerKg:null, revenue:h.revenue!=null?h.revenue:null,
      caughtCount:h.caughtCount!=null?h.caughtCount:null, note:h.note||'',
    }));
    await db.collection('batches').add({
      pondId: pond.id, pondName: pond.name, farmId: pond.farmId,
      species: pond.species||'', brand: pond.brand||'',
      releaseCount: pond.releaseCount||null, releaseDate: pond.releaseDate||'',
      savedAt: todayISO(),
      records: archivedRecords,
      pathogenHistory: pond.pathogenHistory || [],
      harvests: archivedHarvests,
    });
  }
  const writeBatch = db.batch();
  pondRecords.forEach(r=>writeBatch.delete(db.collection('records').doc(r.id)));
  pondHarvests.forEach(h=>writeBatch.delete(db.collection('harvests').doc(h.id)));
  writeBatch.delete(db.collection('ponds').doc(pond.id));
  await writeBatch.commit();
}
